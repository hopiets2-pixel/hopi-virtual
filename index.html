              <div style="background:#fff3e0;color:#e65100;padding:4px 10px;font-size:11px;font-weight:700;text-transform:uppercase">PŘIPRAVENO</div>
            </label>
          </div>
        </div>
      </div>

      <!-- Notifikace / bot -->
      <div class="panel">
        <div class="panel-head"><h3>🔔 Notifikace (příprava pro bota)</h3></div>
        <div style="padding:24px">
          <p style="color:var(--muted);font-size:13px;margin-bottom:20px">Připojení na bota můžeš nastavit později — tady už je místo připravené.</p>
          <div class="settings-grid" class="settings-group">
            <div>
              <label style="display:block;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:6px">Telegram chat ID</label>
              <input type="text" id="notif_telegram" value="${escapeHtml(notif.telegramChat)}" placeholder="Zatím nenastaveno" style="width:100%;padding:10px 14px;border:1px solid #ddd;font-family:'JetBrains Mono',monospace;font-size:13px;background:#fff;color:#111;margin-bottom:16px">
              <div style="font-size:11px;color:var(--muted);margin-top:-10px;margin-bottom:16px">Pro zasílání zpráv přes Telegram bota</div>
            </div>
            <div>
              <label style="display:block;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:6px">Discord webhook URL</label>
              <input type="text" id="notif_discord" value="${escapeHtml(notif.discordWebhook)}" placeholder="Zatím nenastaveno" style="width:100%;padding:10px 14px;border:1px solid #ddd;font-family:'JetBrains Mono',monospace;font-size:13px;background:#fff;color:#111;margin-bottom:16px">
            </div>
          </div>
          <div style="display:grid;gap:10px;margin-top:10px">
            <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:6px">Kdy poslat upozornění</div>
            <label style="display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer">
              <input type="checkbox" id="notif_new" ${notif.notifyOnNew?'checked':''} style="accent-color:var(--green);width:18px;height:18px">
              <span>🆕 Nová objednávka přijata</span>
            </label>
            <label style="display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer">
              <input type="checkbox" id="notif_paid" ${notif.notifyOnPaid?'checked':''} style="accent-color:var(--green);width:18px;height:18px">
              <span>💳 Platba přijata</span>
            </label>
            <label style="display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer">
              <input type="checkbox" id="notif_shipped" ${notif.notifyOnShipped?'checked':''} style="accent-color:var(--green);width:18px;height:18px">
              <span>📦 Objednávka odeslána</span>
            </label>
            <label style="display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer">
              <input type="checkbox" id="notif_email" ${notif.emailAlerts?'checked':''} style="accent-color:var(--green);width:18px;height:18px">
              <span>📧 Posílat i na email</span>
            </label>
          </div>
          <div style="margin-top:20px;display:flex;gap:10px">
            <button class="abtn abtn-primary" onclick="saveNotifSettings()">💾 Uložit</button>
            <button class="abtn" onclick="showToast('Testovací zpráva odeslána (demo)')">📤 Odeslat test</button>
          </div>
          <div style="margin-top:20px;padding:14px;background:#fff8e1;border:1px solid #ffd54f;font-size:13px;color:#f57f17;font-family:'JetBrains Mono',monospace">
            ℹ️ Napojení na skutečné API (Telegram Bot API / Discord Webhooks) vyžaduje backend server. Údaje si zde uložíš a backend je později použije.
          </div>
        </div>
      </div>

    </div>
  `;
}

window.saveNotifSettings=function(){
  const n={
    telegramChat:document.getElementById('notif_telegram').value.trim(),
    discordWebhook:document.getElementById('notif_discord').value.trim(),
    notifyOnNew:document.getElementById('notif_new').checked,
    notifyOnPaid:document.getElementById('notif_paid').checked,
    notifyOnShipped:document.getElementById('notif_shipped').checked,
    emailAlerts:document.getElementById('notif_email').checked,
    botEnabled:true,
  };
  setNotifSettings(n);
  showToast('Notifikace uloženy');
}

window.addPromo=function(existingCode){
  // Modal overlay
  let overlay=document.getElementById('promoModal');
  if(overlay)overlay.remove();
  const existing=existingCode?getPromos().find(p=>p.code===existingCode):null;

  overlay=document.createElement('div');
  overlay.id='promoModal';
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px';
  overlay.innerHTML=`
    <div style="background:#fff;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;border-radius:2px">
      <div style="padding:22px 24px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center">
        <h3 style="font-family:'Archivo Black',sans-serif;font-size:18px;text-transform:uppercase">🎟️ ${existing?'Upravit kód':'Nový slevový kód'}</h3>
        <button onclick="document.getElementById('promoModal').remove()" style="background:none;border:none;font-size:28px;cursor:pointer;color:#666;line-height:1">×</button>
      </div>
      <div style="padding:24px">
        <div style="margin-bottom:18px">
          <label style="display:block;font-family:'JetBrains Mono',monospace;font-size:11px;color:#666;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:6px;font-weight:700">Kód (automaticky velká písmena)</label>
          <input type="text" id="promoCode" value="${existing?escapeHtml(existing.code):''}" placeholder="napr. LETO2026" style="width:100%;padding:12px 14px;border:2px solid #ddd;font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--green)" ${existing?'readonly':''} maxlength="20">
          <div style="font-size:11px;color:#999;margin-top:4px">Použij krátký a zapamatovatelný kód. Bez mezer, jen písmena a čísla.</div>
        </div>

        <div style="margin-bottom:18px">
          <label style="display:block;font-family:'JetBrains Mono',monospace;font-size:11px;color:#666;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:8px;font-weight:700">Typ slevy</label>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <label style="padding:14px;border:2px solid #ddd;cursor:pointer;display:flex;align-items:center;gap:10px;transition:all .2s" id="typeP">
              <input type="radio" name="promoType" value="percent" ${!existing||existing.type==='percent'?'checked':''} onchange="updatePromoType()" style="accent-color:var(--green)">
              <div>
                <strong style="display:block">Procenta</strong>
                <span style="font-size:11px;color:#999">např. 10% sleva</span>
              </div>
            </label>
            <label style="padding:14px;border:2px solid #ddd;cursor:pointer;display:flex;align-items:center;gap:10px;transition:all .2s" id="typeF">
              <input type="radio" name="promoType" value="fixed" ${existing&&existing.type==='fixed'?'checked':''} onchange="updatePromoType()" style="accent-color:var(--green)">
              <div>
                <strong style="display:block">Pevná Kč</strong>
                <span style="font-size:11px;color:#999">např. 200 Kč dolů</span>
              </div>
            </label>
          </div>
        </div>

        <div style="margin-bottom:18px">
          <label style="display:block;font-family:'JetBrains Mono',monospace;font-size:11px;color:#666;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:6px;font-weight:700">Hodnota slevy <span id="promoValueUnit">(%)</span></label>
          <input type="number" id="promoValue" value="${existing?existing.value:''}" placeholder="10" min="1" max="99" style="width:100%;padding:12px 14px;border:2px solid #ddd;font-size:16px;font-weight:700">
          <div style="font-size:11px;color:#999;margin-top:4px" id="promoValueHint">Kolik procent slevy chceš dát? (1-99)</div>
        </div>

        <div style="margin-bottom:18px">
          <label style="display:block;font-family:'JetBrains Mono',monospace;font-size:11px;color:#666;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:6px;font-weight:700">Minimální objednávka (volitelné)</label>
          <input type="number" id="promoMin" value="${existing?existing.minAmount||'':''}" placeholder="0 = bez limitu" min="0" style="width:100%;padding:12px 14px;border:2px solid #ddd;font-size:16px">
          <div style="font-size:11px;color:#999;margin-top:4px">Kolik Kč musí být v košíku aby se dal kód použít. 0 = použitelný vždy.</div>
        </div>

        <div style="margin-bottom:18px">
          <label style="display:block;font-family:'JetBrains Mono',monospace;font-size:11px;color:#666;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:6px;font-weight:700">Max. použití (volitelné)</label>
          <input type="number" id="promoMaxUses" value="${existing&&existing.maxUses?existing.maxUses:''}" placeholder="prázdné = neomezeno" min="1" style="width:100%;padding:12px 14px;border:2px solid #ddd;font-size:16px">
          <div style="font-size:11px;color:#999;margin-top:4px">Kolikrát lze kód maximálně použít. Pro jednorázové kódy zadej 1.</div>
        </div>

        <div style="display:flex;gap:10px;margin-top:24px">
          <button onclick="document.getElementById('promoModal').remove()" class="abtn" style="flex:1">Zrušit</button>
          <button onclick="savePromoFromModal('${existing?existing.code:''}')" class="abtn abtn-primary" style="flex:2">💾 ${existing?'Uložit změny':'Vytvořit kód'}</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.onclick=e=>{if(e.target===overlay)overlay.remove()};
  updatePromoType();
  setTimeout(()=>document.getElementById('promoCode')?.focus(),100);
}

window.updatePromoType=function(){
  const type=document.querySelector('input[name="promoType"]:checked')?.value||'percent';
  const unit=document.getElementById('promoValueUnit');
  const hint=document.getElementById('promoValueHint');
  const input=document.getElementById('promoValue');
  const tP=document.getElementById('typeP');
  const tF=document.getElementById('typeF');
  if(!unit)return;
  if(type==='percent'){
    unit.textContent='(%)';
    hint.textContent='Kolik procent slevy chceš dát? (1-99)';
    input.max=99;
    input.placeholder='10';
    tP.style.borderColor='var(--green)';tP.style.background='rgba(0,138,63,0.05)';
    tF.style.borderColor='#ddd';tF.style.background='#fff';
  }else{
    unit.textContent='(Kč)';
    hint.textContent='Kolik Kč slevy chceš dát?';
    input.removeAttribute('max');
    input.placeholder='200';
    tF.style.borderColor='var(--green)';tF.style.background='rgba(0,138,63,0.05)';
    tP.style.borderColor='#ddd';tP.style.background='#fff';
  }
}

window.savePromoFromModal=function(existingCode){
  let code=(document.getElementById('promoCode').value||'').toUpperCase().replace(/[^A-Z0-9]/g,'').trim();
  const type=document.querySelector('input[name="promoType"]:checked').value;
  const value=Number(document.getElementById('promoValue').value);
  const minAmount=Number(document.getElementById('promoMin').value||0);
  const maxUsesRaw=document.getElementById('promoMaxUses').value;
  const maxUses=maxUsesRaw?Number(maxUsesRaw):null;

  if(!code||code.length<3){showToast('❌ Kód musí mít alespoň 3 znaky','error');return}
  if(!value||value<=0){showToast('❌ Zadej platnou hodnotu slevy','error');return}
  if(type==='percent'&&value>=100){showToast('❌ Procentuální sleva musí být pod 100%','error');return}

  const promos=getPromos();
  if(!existingCode&&promos.find(p=>p.code===code)){
    showToast('❌ Kód '+code+' už existuje','error');return;
  }
  if(existingCode){
    const p=promos.find(x=>x.code===existingCode);
    if(p){
      p.type=type;p.value=value;p.minAmount=minAmount;p.maxUses=maxUses;
    }
  }else{
    promos.push({
      code,type,value,minAmount,maxUses,
      active:true,uses:0,createdAt:Date.now(),
    });
  }
  setPromos(promos);
  document.getElementById('promoModal')?.remove();
  showToast('✅ Kód '+code+' '+(existingCode?'upraven':'vytvořen'));
  viewAdmin();
}

window.togglePromo=function(code){
  const promos=getPromos();
  const p=promos.find(x=>x.code===code);
  if(!p)return;
  p.active=!p.active;
  setPromos(promos);
  showToast(p.active?'Kód aktivován':'Kód deaktivován');
  viewAdmin();
}

window.deletePromo=function(code){
  if(!confirm('Smazat kód '+code+'?'))return;
  setPromos(getPromos().filter(p=>p.code!==code));
  showToast('Kód smazán');
  viewAdmin();
}

// ============== PRODUCT MODAL ==============
let editingId=null;
let modalPhoto=null;
window.adjustStock=function(productId,delta){
  const products=getProducts();
  const p=products.find(x=>x.id===productId);
  if(!p)return;
  if(p.stock===undefined)p.stock=0;
  p.stock=Math.max(0,p.stock+delta);
  setProductsLS(products);
  viewAdmin();
}

window.openProductModal=function(id=null){
  editingId=id;modalPhoto=null;
  ['mId','mName','mPrice','mSizes','mBadge','mStock'].forEach(f=>{const el=document.getElementById(f);if(el)el.value=''});
  document.getElementById('mCat').value='trika';
  document.getElementById('mMock').value='tee';
  document.getElementById('mDelete').style.display='none';
  document.getElementById('modalTitle').innerText='Přidat produkt';
  document.getElementById('mPreview').innerHTML='<div class="photo-preview-empty">Klikni pro nahrání</div>';
  if(id){
    const p=getProduct(id);
    if(p){
      document.getElementById('mId').value=p.id;
      document.getElementById('mName').value=p.name||'';
      document.getElementById('mCat').value=p.category||'trika';
      document.getElementById('mPrice').value=p.price||'';
      document.getElementById('mSizes').value=p.sizes||'';
      document.getElementById('mBadge').value=p.badge||'';
      document.getElementById('mMock').value=p.mockType||'tee';
      const stockEl=document.getElementById('mStock');
      if(stockEl)stockEl.value=p.stock!==undefined?p.stock:'';
      if(p.photo){modalPhoto=p.photo;document.getElementById('mPreview').innerHTML=`<img src="${p.photo}">`}
      document.getElementById('mDelete').style.display='';
      document.getElementById('modalTitle').innerText='Upravit produkt';
    }
  }
  document.getElementById('productModal').classList.add('show');
}
window.closeModal=function(){document.getElementById('productModal').classList.remove('show')}
window.handleModalPhoto=function(e){
  const f=e.target.files[0];if(!f)return;
  if(f.size>2*1024*1024){alert('Max 2 MB');return}
  const r=new FileReader();
  r.onload=ev=>{modalPhoto=ev.target.result;document.getElementById('mPreview').innerHTML=`<img src="${modalPhoto}">`};
  r.readAsDataURL(f);
}
window.removeModalPhoto=function(){modalPhoto=null;document.getElementById('mPhoto').value='';document.getElementById('mPreview').innerHTML='<div class="photo-preview-empty">Klikni pro nahrání</div>'}
window.saveFromModal=function(){
  const name=document.getElementById('mName').value.trim();
  const cat=document.getElementById('mCat').value;
  const price=parseInt(document.getElementById('mPrice').value)||0;
  if(!name){alert('Zadej název');return}
  if(price<=0){alert('Zadej cenu');return}
  const stockVal=document.getElementById('mStock')?.value;
  const stock=stockVal===''||stockVal===undefined?undefined:Math.max(0,parseInt(stockVal)||0);
  const data={name,category:cat,categoryLabel:CATEGORY_LABELS[cat],price,sizes:document.getElementById('mSizes').value.trim(),badge:document.getElementById('mBadge').value.trim(),mockType:document.getElementById('mMock').value,photo:modalPhoto,stock};
  let products=getProducts();
  if(editingId){products=products.map(p=>p.id===editingId?{...p,...data}:p);showToast('Upraveno')}
  else{data.id=products.length?Math.max(...products.map(p=>p.id))+1:1;products.push(data);showToast('Přidáno')}
  setProductsLS(products);
  closeModal();
  viewAdmin();
}
window.deleteFromModal=function(){
  if(!editingId||!confirm('Smazat?'))return;
  const delId = editingId;
  setProductsLS(getProducts().filter(p=>p.id!==delId));
  if(_supabaseReady) deleteProductFromSupabase(delId);
  closeModal();showToast('Smazáno');viewAdmin();
}
window.resetProd=function(){
  if(!confirm('Obnovit výchozí produkty?'))return;
  setProductsLS(DEFAULT_PRODUCTS);showToast('Obnoveno');viewAdmin();
}
</script>
