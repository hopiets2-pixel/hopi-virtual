window.testSheetsConnection=async function(){
  const config=getSheetsConfig();
  if(!config.webhookUrl){showToast('❌ Nejdřív zadej URL','error');return}
  showToast('🧪 Testuji spojení...');
  try{
    const res=await fetch(config.webhookUrl+'?action=ping',{method:'GET'});
    if(res.ok){
      const data=await res.json().catch(()=>null);
      if(data&&data.ok){
        showToast('✅ Spojení funguje!');
      }else{
        showToast('⚠️ Spojení existuje, ale odpověď je divná — zkontroluj kód v Apps Script','error');
      }
    }else{
      showToast('❌ Chyba '+res.status+' — zkontroluj URL','error');
    }
  }catch(e){
    showToast('❌ Nelze se připojit — URL nebo nasazení je špatně','error');
    console.error('Test error:',e);
  }
}

window.syncOrdersFromSheetsManual=async function(){
  showToast('🔄 Synchronizuji...');
  const remote=await fetchOrdersFromSheets();
  if(remote===null){
    showToast('❌ Sync selhal — zkontroluj nastavení','error');
    return;
  }
  const local=getOrders();
  const merged=[...remote];
  local.forEach(lo=>{if(!remote.find(ro=>ro.id===lo.id))merged.push(lo)});
  merged.sort((a,b)=>new Date(b.date)-new Date(a.date));
  setOrders(merged);
  showToast(`✅ Synchronizováno · ${remote.length} objednávek ze Sheets`);
  viewAdmin();
}

// ============== GOOGLE SHEETS BACKEND ==============
function getSheetsConfig(){
  return JSON.parse(localStorage.getItem('hopi_sheets_config')||'{"enabled":false,"webhookUrl":"","syncOnLoad":true}');
}
function setSheetsConfig(c){localStorage.setItem('hopi_sheets_config',JSON.stringify(c))}

// Pošle objednávku do Google Sheets
async function pushOrderToSheets(order){
  const config=getSheetsConfig();
  if(!config.enabled||!config.webhookUrl)return {ok:false,reason:'not_configured'};
  try{
    const res=await fetch(config.webhookUrl,{
      method:'POST',
      mode:'no-cors', // Google Apps Script vyžaduje tohle
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'create',order}),
    });
    // no-cors znamená že nemůžeme číst response, ale pokud nehodí error, funguje
    return {ok:true};
  }catch(e){
    console.error('Sheets error:',e);
    return {ok:false,reason:e.message};
  }
}

// Aktualizace stavu objednávky v Sheets
async function updateOrderInSheets(orderId,updates){
  const config=getSheetsConfig();
  if(!config.enabled||!config.webhookUrl)return {ok:false};
  try{
    await fetch(config.webhookUrl,{
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'update',orderId,updates}),
    });
    return {ok:true};
  }catch(e){return {ok:false,reason:e.message}}
}

// Stáhne objednávky z Sheets (JSONP technika kvůli CORS)
async function fetchOrdersFromSheets(){
  const config=getSheetsConfig();
  if(!config.enabled||!config.webhookUrl)return null;
  try{
    // Použijeme GET, který Google Apps Script podporuje přes JSONP
    const url=config.webhookUrl+'?action=list&_='+Date.now();
    const res=await fetch(url,{method:'GET'});
    if(!res.ok)return null;
    const data=await res.json();
    return data.orders||[];
  }catch(e){
    console.error('Fetch orders error:',e);
    return null;
  }
}

// Sync při spuštění admina — stáhne objednávky ze Sheets do lokálního storage
async function syncOrdersFromSheets(){
  const remote=await fetchOrdersFromSheets();
  if(!remote)return;
  const local=getOrders();
  // Smerge — remote je zdroj pravdy, ale zachováme lokální změny co nejsou v remote
  const merged=[...remote];
  // Přidat lokální objednávky, které ještě nejsou v remote (čekají na sync)
  local.forEach(lo=>{
    if(!remote.find(ro=>ro.id===lo.id)){
      merged.push(lo);
    }
  });
  // Seřadit od nejnovější
  merged.sort((a,b)=>new Date(b.date)-new Date(a.date));
  setOrders(merged);
}

function getRoute(){

  const [path,query]=h.split('?');
  const params={};
  if(query)query.split('&').forEach(kv=>{const[k,v]=kv.split('=');params[k]=decodeURIComponent(v||'')});
  return {path:path||'home',params};
}

// KRITICKÉ: Admin nastavení (GoPay, platební metody, Snipcart) MUSÍ být v Supabase,
// ne v localStorage, aby je viděli zákazníci napříč všemi prohlížeči/zařízeními.
// localStorage cache slouží jen pro rychlost při opakovaném načtení.

const _appSettingsCache = {};
let _appSettingsLoaded = false;

async function loadAppSettings(){
  try {
    const { data, error } = await supabaseClient
      .from('app_settings')
      .select('key, value');
    if(error){
      console.warn('⚠️ loadAppSettings error:', error.message);
      // Pokud tabulka neexistuje (PGRST...), zkusíme fallback z localStorage
      _loadAppSettingsFromLocalStorage();
      return;
    }
    for(const row of (data || [])){
      _appSettingsCache[row.key] = row.value;
    }
    _appSettingsLoaded = true;
    // Cache do localStorage pro rychlost při dalším načtení
    try { localStorage.setItem('hopi_app_settings_cache', JSON.stringify(_appSettingsCache)); } catch(e){}
    console.log('✅ Načteno', Object.keys(_appSettingsCache).length, 'app settings ze Supabase');
  } catch(e){
    console.warn('⚠️ loadAppSettings exception:', e);
    _loadAppSettingsFromLocalStorage();
  }
}

function _loadAppSettingsFromLocalStorage(){
  // Fallback: použít cache z localStorage (rychlé), pokud Supabase nejde
  try {
    const cached = localStorage.getItem('hopi_app_settings_cache');
    if(cached){
      Object.assign(_appSettingsCache, JSON.parse(cached));
      console.log('📦 App settings z localStorage cache:', Object.keys(_appSettingsCache).length, 'klíčů');
    }
  } catch(e){}
}

function getAppSetting(key, defaultValue=null){
  return _appSettingsCache[key] ?? defaultValue;
}

async function saveAppSetting(key, value){
  _appSettingsCache[key] = value;
  // Update local cache
  try { localStorage.setItem('hopi_app_settings_cache', JSON.stringify(_appSettingsCache)); } catch(e){}
  try {
    const { error } = await supabaseClient
      .from('app_settings')
      .upsert({ key, value, updated_at: new Date().toISOString() }, { onConflict: 'key' });
    if(error){
      console.error('❌ saveAppSetting error:', error.message);
      return false;
    }
    console.log('✅ Saved app setting:', key);
    return true;
  } catch(e){
    console.error('❌ saveAppSetting exception:', e);
    return false;
  }
}

// Před prvním renderem zkusíme načíst produkty a objednávky ze Supabase
window.addEventListener('load', async () => {
  await checkAdminSession(); // ověřit zda je session platná
  await Promise.all([
    loadAppSettings(),         // ← KRITICKÉ — musí být před render (zákazník potřebuje vědět, jestli je GoPay aktivní)
    syncProductsFromSupabase(),
    syncOrdersFromSupabase()
  ]);
  render();
  
  // Snipcart event listener — když přijde objednávka, uložíme ji do Supabase
  document.addEventListener('snipcart.ready', () => {
    console.log('🛒 Snipcart ready');
    if(!window.Snipcart) return;
    
    window.Snipcart.events.on('order.completed', (snipOrder) => {
      console.log('✅ Snipcart objednávka dokončena:', snipOrder);
      
      // Hybrid mode: máme existující "pending" objednávku z naší checkout?
      const pendingRaw = localStorage.getItem('hopi_pending_snipcart_order');
      if(pendingRaw){
        try {
          const pending = JSON.parse(pendingRaw);
          // Aktualizovat existující objednávku (dopnout payment status + Snipcart token)
          const orders = getOrders();
          const found = orders.find(o => o.id === pending.id);
          if(found){
            found.paymentStatus = 'paid';
            found.paid = true;
            found.snipcartToken = snipOrder.token;
            found.snipcartInvoice = snipOrder.invoiceNumber;
            found.statusHistory.push({status:'paid',at:Date.now()});
            setOrders(orders);
            // Odečíst sklad (teprve teď když je zaplaceno)
            found.items.forEach(i => decreaseStock(i.productId, i.qty));
            // Použít slevu
            if(found.promo){
              const promos = getPromos();
              const p = promos.find(x => x.code === found.promo.code);
              if(p){ p.uses = (p.uses||0) + 1; setPromos(promos); }
            }
            setCart([]);
            setAppliedPromo(null);
            localStorage.setItem('hopi_last_order', JSON.stringify(found));
            localStorage.removeItem('hopi_pending_snipcart_order');
            // Poslat do Sheets + e-mail
            pushOrderToSheets(found).catch(()=>{});
            sendStatusEmail(found, 'new').catch(()=>{});
            // Přesměrovat na success
            setTimeout(()=>go('success'), 500);
            console.log('💾 Hybrid objednávka aktualizována:', found.id);
            return;
          }
        } catch(e){ console.warn('Hybrid update fail:', e); }
      }
      
      // Fallback: pokud není pending (přímý nákup ze Snipcart košíku)
      saveSnipcartOrder(snipOrder);
    });
  });
});

// Konvertuje Snipcart objednávku do našeho formátu a uloží do Supabase
async function saveSnipcartOrder(snipOrder){
  try {
    const orderId = 'SC-' + (snipOrder.invoiceNumber || snipOrder.token || Date.now());
    const order = {
      id: orderId,
      date: snipOrder.completionDate || new Date().toISOString(),
      status: 'new',
      total: snipOrder.finalGrandTotal || snipOrder.total || 0,
      currency: snipOrder.currency || 'czk',
      paid: true,
      paymentMethod: 'snipcart',
      snipcartToken: snipOrder.token,
      customer: {
        email: snipOrder.email || '',
        name: (snipOrder.billingAddressName || snipOrder.shippingAddressName || ''),
        phone: snipOrder.shippingAddressPhone || snipOrder.billingAddressPhone || '',
        address: snipOrder.shippingAddress1 || '',
        city: snipOrder.shippingAddressCity || '',
        zip: snipOrder.shippingAddressPostalCode || '',
        country: snipOrder.shippingAddressCountry || 'CZ'
      },
      items: (snipOrder.items||[]).map(it => ({
        productId: it.id,
        name: it.name,
        size: (it.customFields||[]).find(f=>f.name==='Velikost')?.value || '',
        qty: it.quantity,
        price: it.price
      })),
      shipping: snipOrder.shippingMethod || '',
      shippingCost: snipOrder.shippingFees || 0,
      notes: ''
    };
    saveOrder(order);
    console.log('💾 Snipcart objednávka uložena do Supabase:', orderId);
  } catch(e){
    console.error('Chyba při ukládání Snipcart objednávky:', e);
  }
}

function renderProductCard(p){
  const stock=stockStatus(p);
  const soldOut=stock.count===0;
  return `
    <a class="product ${soldOut?'out-of-stock':''}" data-cat="${escapeHtml(p.category)}" onclick="go('product?id=${p.id}')">
      <div class="product-img">
        ${p.badge&&!soldOut?`<div class="product-badge">${escapeHtml(p.badge)}</div>`:''}
        ${getMockHTML(p)}
      </div>
      <div class="product-info">
        <div class="product-category">${escapeHtml(p.categoryLabel||p.category)}</div>
        <div class="product-name">${escapeHtml(p.name)}</div>
        <div style="margin-bottom:8px"><span class="stock-badge ${stock.cls}"><span class="stock-dot"></span>${escapeHtml(stock.label)}</span></div>
        <div class="product-footer">
          <div class="product-price">${formatPrice(p.price)}<span class="currency">Kč</span></div>
          <div class="product-sizes">${escapeHtml(p.sizes||'')}</div>
        </div>
      </div>
    </a>
  `;
}

              <button class="btn sold-out-btn" disabled style="grid-column:1/-1">Vyprodáno</button>
            `:`
              <button class="btn btn-outline" id="addToCart">Přidat do košíku</button>
              <button class="btn btn-primary" id="buyNow">Koupit teď <span class="arrow">→</span></button>
            `}
          </div>
        </div>

    document.querySelectorAll('.size-btn').forEach(x=>x.classList.remove('selected'));
    b.classList.add('selected');
  }));

  let qty=1;
  const qMinus=document.getElementById('qMinus');
  const qPlus=document.getElementById('qPlus');
  if(qMinus)qMinus.onclick=()=>{if(qty>1){qty--;document.getElementById('qVal').innerText=qty}};
  if(qPlus)qPlus.onclick=()=>{

    setCart(cart);
    setTimeout(()=>go('checkout'),300);
  };

// Pomocná funkce — kontrola jestli je Snipcart aktivní
function isSnipcartActive(){
  try {
    const cfg = JSON.parse(localStorage.getItem('hopi_payments_config')||'null');
    if(!cfg || cfg.provider !== 'snipcart') return false;
    const key = cfg.mode === 'live' ? cfg.snipcartLiveKey : cfg.snipcartTestKey;
    return !!key;
  } catch(e){ return false; }
}

// Promo kód helpers
function getAppliedPromo(){return JSON.parse(sessionStorage.getItem('hopi_applied_promo')||'null')}
function setAppliedPromo(p){if(p)sessionStorage.setItem('hopi_applied_promo',JSON.stringify(p));else sessionStorage.removeItem('hopi_applied_promo')}
function calcDiscount(promo,subtotal){
  if(!promo)return 0;
  if(promo.type==='percent')return Math.round(subtotal*promo.value/100);
  return Math.min(promo.value,subtotal);
}

window.applyPromoCode=function(){
  const input=document.getElementById('promoInput');
  if(!input)return;
  const code=input.value.toUpperCase().replace(/[^A-Z0-9]/g,'').trim();
  if(!code){showToast('Zadej slevový kód','error');return}
  const promo=getPromos().find(p=>p.code===code);
  if(!promo){showToast('❌ Kód "'+code+'" neexistuje','error');return}
  if(!promo.active){showToast('❌ Tento kód byl vypnutý','error');return}
  if(promo.maxUses&&promo.uses>=promo.maxUses){showToast('❌ Tento kód byl už vyčerpán','error');return}
  const total=cartTotal();
  if(promo.minAmount&&total<promo.minAmount){
    showToast('❌ Kód platí od '+formatPrice(promo.minAmount)+' Kč. Přidej ještě '+formatPrice(promo.minAmount-total)+' Kč.','error');
    return;
  }
  setAppliedPromo(promo);
  const disc=calcDiscount(promo,total);
  showToast('✅ Sleva '+formatPrice(disc)+' Kč uplatněna!');
  render();
}

window.removePromo=function(){
  setAppliedPromo(null);
  showToast('Slevový kód odstraněn');
  render();
}

window.changeQty=function(idx,d){const c=getCart();c[idx].qty+=d;if(c[idx].qty<=0)c.splice(idx,1);setCart(c);render()}
window.removeItem=function(idx){const c=getCart();c.splice(idx,1);setCart(c);showToast('Odstraněno');render()}

window.submitOrder=function(){
  // Validace telefonu
  if(!validatePhone('phone')||!isValidPhone(getPhoneValue('phone'))){
    showToast('❌ Telefon musí mít 9 číslic','error');
    document.getElementById('phone')?.focus();
    return;
  }
  const shipOpt=document.querySelector('.option[data-ship].selected');
  const payOpt=document.querySelector('.option[data-pay].selected');
  const cod=payOpt.dataset.pay==='cod'?39:0;
  const shipPrice=Number(shipOpt.dataset.price);
  const wantInvoice=document.getElementById('wantInvoice')?.checked||false;
  const shipCarrier=shipOpt.dataset.ship;
  const zasilkovnaBranch=shipCarrier==='zasilkovna'?(document.getElementById('zasilkovnaBranch')?.value||'').trim():'';
  if(shipCarrier==='zasilkovna'&&!zasilkovnaBranch){
    showToast('Vyber pobočku Zásilkovny','error');
    document.getElementById('zasilkovnaBranch')?.focus();
    return;
  }

  const subtotal=cartTotal();
  const appliedPromo=getAppliedPromo();
  const discount=calcDiscount(appliedPromo,subtotal);
  const finalTotal=Math.max(0,subtotal-discount)+shipPrice+cod;

  const order={
    id:'HV-'+Math.floor(100000+Math.random()*900000),
    items:getCart(),
    customer:{
      firstName:document.getElementById('firstName').value,
      lastName:document.getElementById('lastName').value,
      email:document.getElementById('email').value,
      phone:getPhoneValue('phone'),
      street:document.getElementById('street').value,
      city:document.getElementById('city').value,
      zip:document.getElementById('zip').value,
    },
    invoice:wantInvoice?{
      companyName:document.getElementById('companyName')?.value||'',
      ico:document.getElementById('companyIco')?.value||'',
      dic:document.getElementById('companyDic')?.value||'',
    }:null,
    ship:shipOpt.dataset.ship,
    shipBranch:zasilkovnaBranch,
    pay:payOpt.dataset.pay,
    paymentStatus:(payOpt.dataset.pay==='cod'?'cod':(['card','applepay','googlepay'].includes(payOpt.dataset.pay)?'pending':'pending')),
    subtotal,
    promo:appliedPromo?{code:appliedPromo.code,type:appliedPromo.type,value:appliedPromo.value,discount}:null,
    shipPrice,
    codFee:cod,
    total:finalTotal,
    status:'new',
    statusHistory:[{status:'new',at:Date.now()}],
    adminNote:'',
    date:new Date().toISOString(),
  };

  // 🔀 PRIORITA: GoPay (pokud aktivní) → Snipcart (pokud aktivní) → standardní cesta
  const isCardPayment = ['card','applepay','googlepay'].includes(order.pay);
  
  // 🛡️ KRITICKÝ SAFETY GUARD: Pokud zákazník vybral kartu/Apple Pay/Google Pay,
  // MUSÍ být aktivní GoPay nebo Snipcart. Jinak by se objednávka uložila bez platby.
  if(isCardPayment && !isGoPayActive() && !isSnipcartActive()){
    alert('⚠️ Online platby kartou momentálně nejsou dostupné.\n\nVyber prosím jinou metodu (bankovní převod nebo dobírka).\n\nPokud chyba přetrvává, kontaktuj nás na ' + (getSettings().contactEmail || 'eshophopivirtual@gmail.com') + '.');
    return;
  }
  
  if(isCardPayment && isGoPayActive()){
    payViaGoPay(order);
    return;
  }
  if(isCardPayment && isSnipcartActive()){
    payViaSnipcart(order);
    return;
  }

  // Standardní cesta: bankovní převod, dobírka, atd.
  if(appliedPromo){
    const promos=getPromos();
    const p=promos.find(x=>x.code===appliedPromo.code);
    if(p){p.uses=(p.uses||0)+1;setPromos(promos)}
  }

  saveOrder(order);
  localStorage.setItem('hopi_last_order',JSON.stringify(order));
  // Odečíst sklad
  order.items.forEach(i=>decreaseStock(i.productId,i.qty));
  setCart([]);
  setAppliedPromo(null);
  // Poslat do Google Sheets (pokud nastaveno)
  pushOrderToSheets(order).catch(()=>{});
  // Auto potvrzovací e-mail zákazníkovi
  sendStatusEmail(order,'new').catch(()=>{});
  go('success');
}

// ============== SNIPCART HYBRID PLATBA ==============
// Vezme tvou objednávku, pošle do Snipcart, zákazník zaplatí kartou
async function payViaSnipcart(order){
  try {
    showToast('💳 Připravuji platbu...');
    
    // Uložit objednávku PŘED platbou jako "pending"
    saveOrder(order);
    localStorage.setItem('hopi_pending_snipcart_order', JSON.stringify(order));
    
    // Počkat na Snipcart
    if(!window.Snipcart){
      // Forznout načtení
      if(window.LoadSnipcart) window.LoadSnipcart();
      await new Promise(resolve => {
        const check = () => {
          if(window.Snipcart) resolve();
          else setTimeout(check, 200);
        };
        check();
      });
    }
    
    // Vyčistit Snipcart košík (kdyby tam něco bylo)
    try { await window.Snipcart.api.cart.reset(); } catch(e){}
    
    // Přidat položky z naší objednávky do Snipcart košíku
    const products = getProducts();
    for(const item of order.items){
      const product = products.find(p => p.id === item.productId);
      if(!product) continue;
      const itemId = product.id + (item.size ? '-' + item.size : '');
      
      await window.Snipcart.api.cart.items.add({
        id: String(itemId),
        name: product.name + (item.size ? ' (' + item.size + ')' : ''),
        price: product.price,
        url: location.origin + '/products.json',
        quantity: item.qty,
        image: product.photo || '',
        customFields: item.size ? [{name:'Velikost', value:item.size}] : []
      });
    }
    
    // Předvyplnit zákaznická data
    try {
      await window.Snipcart.api.session.setCustomer({
        email: order.customer.email,
        billingAddress: {
          name: order.customer.firstName + ' ' + order.customer.lastName,
          firstName: order.customer.firstName,
          lastName: order.customer.lastName,
          address1: order.customer.street,
          city: order.customer.city,
          country: 'CZ',
          postalCode: order.customer.zip,
          phone: order.customer.phone
        },
        shippingAddressSameAsBilling: true
      });
    } catch(e){ console.warn('Customer data set fail:', e); }
    
    // Otevřít Snipcart checkout
    showToast('🔓 Otvírám platbu...');
    setTimeout(() => {
      window.Snipcart.api.theme.cart.open();
    }, 300);
    
  } catch(e){
    console.error('Snipcart pay error:', e);
    showToast('❌ Chyba platby: ' + e.message, 'error');
  }
}

// ============== SNIPCART JSON VALIDATOR ==============
// Generuje products.json pro Snipcart server-side validaci.
// Snipcart při placení kartou stáhne tento soubor a ověří, že se ID a cena
// produktu v košíku shoduje s daty na serveru (ochrana proti manipulaci v DevTools).
// JSON musí být dostupný na https://[domena]/products.json
function generateProductsJson(){
  const products = getProducts();
  const out = [];
  for(const p of products){
    // Varianta bez velikosti (pro produkty bez velikostí)
    out.push({ id: String(p.id), price: Number(p.price), url: '/products.json' });
    // Varianty s velikostí — Snipcart itemId je 'id-size'
    if(p.sizes){
      const sizes = String(p.sizes).split('/').map(s => s.trim()).filter(Boolean);
      for(const size of sizes){
        out.push({ id: p.id + '-' + size, price: Number(p.price), url: '/products.json' });
      }
    }
  }
  return JSON.stringify(out, null, 2);
}

window.downloadProductsJson = function(){
  const content = generateProductsJson();
  const blob = new Blob([content], {type: 'application/json;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'products.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  showToast('📥 products.json stažen — nahraj ho do Netlify (kořen webu)');
}

window.copyProductsJson = function(){
  const content = generateProductsJson();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(content).then(
      () => showToast('📋 JSON zkopírován do schránky'),
      () => fallbackCopy(content)
    );
  } else {
    fallbackCopy(content);
  }
  function fallbackCopy(text){
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast('📋 JSON zkopírován'); }
    catch(e){ showToast('❌ Kopírování selhalo — použij tlačítko Stáhnout', 'error'); }
    document.body.removeChild(ta);
  }
}

window.previewProductsJson = function(){
  const content = generateProductsJson();
  const ta = document.getElementById('productsJsonPreview');
  if(ta) ta.value = content;
}

const PAYMENT_METHODS_META = [
  { key: 'card',      label: 'Platební karta',  sub: 'Visa / Mastercard',     icon: '💳', viaGoPay: true,  defaultEnabled: true  },
  { key: 'applepay',  label: 'Apple Pay',       sub: 'Dotykem',               icon: '🍎', viaGoPay: true,  defaultEnabled: true  },
  { key: 'googlepay', label: 'Google Pay',      sub: 'Dotykem',               icon: '🤖', viaGoPay: true,  defaultEnabled: false },
  { key: 'transfer',  label: 'Bankovní převod', sub: '1–2 dny',               icon: '🏦', viaGoPay: false, defaultEnabled: true  },
  { key: 'cod',       label: 'Dobírka',         sub: '+39 Kč',                icon: '📦', viaGoPay: false, defaultEnabled: true  },
];

  const stored = getAppSetting('payment_methods');

  // default — vše zapnuté kromě Google Pay (musí se zapnout u GoPay zvlášť)
  const def = {};
  for(const m of PAYMENT_METHODS_META) def[m.key] = m.defaultEnabled;
  return def;
}
async function setPaymentMethodsConfig(cfg){
  return await saveAppSetting('payment_methods', cfg);
}
function isPaymentMethodEnabled(key){
  return !!getPaymentMethodsConfig()[key];
}
function renderPaymentOptions(){
  const cfg = getPaymentMethodsConfig();

// Bezpečný zápis do localStorage — v Safari Private Mode může selhat
function safeLSset(key, value){
  try { localStorage.setItem(key, value); return true; }
  catch(e){ console.warn('localStorage.setItem failed:', e); return false; }
}
function safeLSget(key){
  try { return localStorage.getItem(key); }
  catch(e){ console.warn('localStorage.getItem failed:', e); return null; }
}
function safeLSremove(key){
  try { localStorage.removeItem(key); }
  catch(e){ console.warn('localStorage.removeItem failed:', e); }
}

async function payViaGoPay(order){
  // 🛡️ KRITICKÉ: Vůbec NIC neprovádíme (sklad, košík, success) dokud nemáme gw_url z GoPay.
  // Pokud cokoliv selže, zákazník zůstane v košíku a vidí chybu — žádná tichá ztráta.
  
  let createBtn = null;
  try {
    // Najít a disablovat tlačítko "Objednat", aby se nemohlo spustit 2×
    createBtn = document.querySelector('[onclick*="createOrder"], .create-order-btn');
    if(createBtn){ createBtn.disabled = true; createBtn.style.opacity = '0.6'; }
    
    showToast('💳 Připravuji platbu přes GoPay...');
    
    // 1) Ověřit, že máme Supabase config
    const sbUrl = SUPABASE_URL;
    const sbKey = SUPABASE_KEY;
    if(!sbUrl || !sbKey){
      throw new Error('Supabase není nakonfigurován');
    }
    
    // 2) Sestavit URL pro Edge Function
    const baseUrl = location.origin + location.pathname;
    const returnUrl = baseUrl + '#/gopay-return';
    const notificationUrl = sbUrl + '/functions/v1/gopay-notification';
    
    // 3) Zavolat Edge Function (s timeoutem 25s, aby nezamrzlo)
    const ctrl = new AbortController();
    const timeoutId = setTimeout(() => ctrl.abort(), 25000);
    
    const res = await fetch(sbUrl + '/functions/v1/gopay-create-payment', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': sbKey,
        'Authorization': 'Bearer ' + sbKey,
      },
      body: JSON.stringify({ order, returnUrl, notificationUrl }),
      signal: ctrl.signal,
    });
    clearTimeout(timeoutId);
    
    if(!res.ok){
      const errText = await res.text();
      throw new Error('GoPay create-payment selhal (HTTP '+res.status+'): ' + errText);
    }
    
    const data = await res.json();
    if(!data.gw_url){
      throw new Error('GoPay nevrátil platební URL: ' + JSON.stringify(data));
    }
    
    // ✅ MÁME gw_url — TEPRVE TEĎ ukládáme objednávku a vyčistíme košík
    // (kdyby byl výpadek mezi tímhle a redirectem, objednávka bude v Supabase
    //  s paymentStatus pending — vyřeší webhook nebo handleGoPayReturn)
    saveOrder(order);
    safeLSset('hopi_pending_gopay_order', JSON.stringify(order));
    safeLSset('hopi_last_order', JSON.stringify(order));
    safeLSset('hopi_pending_gopay_payment_id', String(data.id));
    
    order.items.forEach(i => decreaseStock(i.productId, i.qty));
    setCart([]);
    setAppliedPromo(null);
    
    // 4) PŘESMĚROVAT OKAMŽITĚ — žádný setTimeout, žádný toast preview!
    // Safari (zvlášť Private Mode) blokuje cross-domain redirecty zpožděné víc než pár ms.
    // Musíme zůstat v rámci stejného microtasku jako uživatelův click.
    window.location.href = data.gw_url;
    
  } catch(e){
    // Pokud cokoliv selže — VRÁTIT zákazníka do checkoutu s jasnou chybou
    console.error('GoPay pay error:', e);
    
    if(createBtn){ createBtn.disabled = false; createBtn.style.opacity = '1'; }
    
    const msg = e.name === 'AbortError'
      ? 'GoPay neodpovídá. Zkontroluj připojení a zkus to znovu, prosím.'
      : 'Platba nemohla být zahájena: ' + (e.message || 'neznámá chyba');
    
    // Trvalá chybová hláška (alert) místo toastu, který zákazník nemusí vidět
    alert('⚠️ ' + msg + '\n\nObjednávka NEBYLA odeslána. Můžeš ji znovu zkusit, nebo zvolit jinou platební metodu (převod, dobírka).');
    
    // NEVYČIŠŤOVAT košík, NEUKLÁDAT do success — zákazník zůstává v checkoutu
  }
}

// Po návratu zákazníka z GoPay — voláme status endpoint a podle stavu zobrazíme výsledek
async function handleGoPayReturn(){
  const paymentId = safeLSget('hopi_pending_gopay_payment_id');
  if(!paymentId){
    go('home');
    return;
  }
  
  document.getElementById('app').innerHTML = `
    ${renderNavbar()}
    <main class="page" style="min-height:60vh;display:flex;align-items:center;justify-content:center">
      <div style="text-align:center;padding:40px">
        <div style="font-size:48px;margin-bottom:20px">⏳</div>
        <h2 style="font-family:'Archivo Black',sans-serif;color:var(--green-glow);margin-bottom:14px">Ověřuji platbu...</h2>
        <p style="color:var(--muted)">Moment, kontroluji stav s GoPay.</p>
      </div>
    </main>
    ${renderFooter()}
  `;
  
  try {
    const sbUrl = SUPABASE_URL;
    const sbKey = SUPABASE_KEY;
    
    const res = await fetch(sbUrl + '/functions/v1/gopay-status?id=' + encodeURIComponent(paymentId), {
      headers: { 'apikey': sbKey, 'Authorization': 'Bearer ' + sbKey },
    });
    const data = await res.json();
    
    // Aktualizovat order paymentStatus podle GoPay stavu
    const lastOrder = JSON.parse(safeLSget('hopi_last_order')||'null');
    if(lastOrder){
      let newStatus = 'pending';
      if(data.state === 'PAID') newStatus = 'paid';
      else if(data.state === 'CANCELED') newStatus = 'canceled';
      else if(data.state === 'TIMEOUTED') newStatus = 'expired';
      else if(data.state === 'AUTHORIZED') newStatus = 'authorized';
      
      lastOrder.paymentStatus = newStatus;
      lastOrder.gopayPaymentId = paymentId;
      lastOrder.gopayState = data.state;
      
      // Update localStorage
      const orders = getOrders();
      const idx = orders.findIndex(o => o.id === lastOrder.id);
      if(idx >= 0){
        orders[idx] = lastOrder;
        safeLSset('hopi_orders', JSON.stringify(orders));
      }
      safeLSset('hopi_last_order', JSON.stringify(lastOrder));
      
      // Sync do Supabase
      if(_supabaseReady) saveOrderToSupabase(lastOrder);
    }
    
    // Vyčistit pending markers
    safeLSremove('hopi_pending_gopay_order');
    safeLSremove('hopi_pending_gopay_payment_id');
    
    // Zobrazit success / failure
    if(data.state === 'PAID' || data.state === 'AUTHORIZED'){
      go('success');
    } else {
      // Neúspěšná platba — vrátit na success page s informací
      go('success');
      setTimeout(() => {
        showToast('⚠️ Platba nebyla dokončena (stav: ' + (data.state||'neznámý') + ')', 'error');
      }, 500);
    }
    
  } catch(e){
    console.error('GoPay return handler error:', e);
    showToast('❌ Chyba ověření platby: ' + e.message, 'error');
    setTimeout(() => go('home'), 2000);
  }
}

window.doTrack=function(){
  const id=document.getElementById('trackId').value.trim().toUpperCase();
  const email=document.getElementById('trackEmail').value.trim().toLowerCase();
  const orders=getOrders();
  const o=orders.find(x=>x.id.toUpperCase()===id&&(x.customer.email||'').toLowerCase()===email);
  if(!o){
    showToast('❌ Objednávka nenalezena. Zkontroluj číslo a e-mail.','error');
    return;
  }
  go('trackOrder?id='+encodeURIComponent(id)+'&email='+encodeURIComponent(email));
}

  }
  const products=getProducts();

window.loginEmail=function(){
  const email=document.getElementById('email').value.trim();
  const name=email.split('@')[0].replace(/[.\-_]/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
  setUser({email,name,firstName:name.split(' ')[0]||name,lastName:name.split(' ')[1]||'',createdAt:Date.now()});
  showToast('Přihlášeno');
  setTimeout(()=>go('account'),500);
}
let phoneEnteredGlobal='';
window.handlePhone=function(){
  if(document.getElementById('phoneStep1').style.display!=='none'){
    phoneEnteredGlobal=document.getElementById('phone').value.trim();
    if(phoneEnteredGlobal.length<9){showToast('Neplatné číslo','error');return}
    document.getElementById('phoneStep1').style.display='none';
    document.getElementById('phoneStep2').style.display='';
    showToast('SMS odeslána (demo)');
  }else{
    if(document.getElementById('otpCode').value.length!==6){showToast('Zadej 6 číslic','error');return}
    setUser({phone:phoneEnteredGlobal,name:'Zákazník',firstName:'',lastName:'',createdAt:Date.now()});
    showToast('Přihlášeno');
    setTimeout(()=>go('account'),500);
  }
}

window.submitComplaint=function(){
  const orderId=document.getElementById('complaintOrderId').value.trim().toUpperCase();
  const email=document.getElementById('complaintEmail').value.trim().toLowerCase();
  // Ověř že objednávka existuje s tímto e-mailem
  const orders=getOrders();
  const o=orders.find(x=>x.id.toUpperCase()===orderId&&(x.customer.email||'').toLowerCase()===email);
  if(!o){
    showToast('❌ Objednávka s tímto e-mailem nenalezena','error');
    return;
  }

  const reasonEl=document.querySelector('input[name="reason"]:checked');
  const reason=reasonEl?reasonEl.value:'other';
  const reasonLabel=reasonEl?reasonEl.closest('.complaint-reason').querySelector('strong').textContent:'Jiný důvod';
  const desc=document.getElementById('complaintDesc').value.trim();
  const phone=getPhoneValue('complaintPhone');
  // Pokud zadal telefon, musí být validní
  if(phone&&!isValidPhone(phone)){
    showToast('❌ Telefon musí mít 9 číslic','error');
    return;
  }
  if(desc.length<10){showToast('Popiš podrobněji (min 10 znaků)','error');return}

  const complaint={
    id:'REK-'+Math.floor(100000+Math.random()*900000),
    orderId:o.id,
    reason,
    reasonLabel,
    description:desc,
    email,
    phone,
    status:'pending',
    createdAt:Date.now(),
  };
  saveComplaint(complaint);

  // Označit objednávku štítkem reklamace
  o.tags=o.tags||[];
  if(!o.tags.includes('reclamation'))o.tags.push('reclamation');
  setOrders(orders);

  showToast('✅ Reklamace odeslána — ozveme se do 24 h');
  setTimeout(()=>go('home'),1500);
}

      <p style="margin-top:10px">Prodávající je oprávněn jednostranně započíst nárok na náhradu škody vzniklou na vráceném zboží oproti nároku kupujícího na vrácení kupní ceny.</p>

      <h2 style="font-family:'Archivo Black',sans-serif;font-size:18px;margin-bottom:10px;margin-top:20px;text-transform:uppercase">7. Reklamace a práva z vadného plnění</h2>
      <p>Prodávající odpovídá kupujícímu, že zboží při převzetí nemá vady a že má vlastnosti, které si strany ujednaly, hodí se k uvedenému účelu a vyhovuje požadavkům právních předpisů.</p>
      <p style="margin-top:10px">Kupující je oprávněn uplatnit právo z vady, která se vyskytne u spotřebního zboží, v době <strong style="color:#fff">24 měsíců</strong> od převzetí zboží.</p>
      <p style="margin-top:10px">V případě výskytu vady může kupující uplatnit reklamaci a požadovat:</p>
      <ul style="padding-left:24px;line-height:1.8;margin-top:6px">
        <li>výměnu za nové zboží,</li>
        <li>opravu zboží,</li>
        <li>přiměřenou slevu z kupní ceny,</li>
        <li>odstoupení od smlouvy (při podstatné vadě nebo opakovaném výskytu vady).</li>
      </ul>
      <p style="margin-top:10px">Reklamaci může kupující uplatnit prostřednictvím e-mailu <a href="mailto:eshophopivirtual@gmail.com" style="color:var(--green-glow)">eshophopivirtual@gmail.com</a> nebo telefonicky. Prodávající je povinen kupujícímu vydat písemné potvrzení o přijetí reklamace, jejím obsahu a požadovaném způsobu vyřízení.</p>
      <p style="margin-top:10px">Reklamace musí být vyřízena bezodkladně, nejpozději do <strong style="color:#fff">30 dnů</strong> ode dne jejího uplatnění. Marné uplynutí této lhůty se považuje za podstatné porušení smlouvy a kupující má právo od smlouvy odstoupit.</p>
      <p style="margin-top:10px">Právo z vadného plnění kupujícímu nenáleží, pokud vadu sám způsobil nebo o ní před převzetím zboží věděl.</p>

      <h2 style="font-family:'Archivo Black',sans-serif;font-size:18px;margin-bottom:10px;margin-top:20px;text-transform:uppercase">8. Ochrana osobních údajů</h2>
      <p>Osobní údaje kupujícího jsou zpracovávány za účelem vyřízení objednávky a plnění smlouvy v souladu s platnými právními předpisy.</p>
      <p style="margin-top:10px">Prodávající se zavazuje chránit osobní údaje kupujícího a neposkytovat je třetím stranám bez souhlasu kupujícího, s výjimkou případů stanovených zákonem nebo nezbytných pro plnění smlouvy (např. přepravce).</p>
      <p style="margin-top:10px">Kupující má právo kdykoliv odvolat souhlas se zasíláním obchodních sdělení, a to zasláním e-mailu na adresu <a href="mailto:eshophopivirtual@gmail.com" style="color:var(--green-glow)">eshophopivirtual@gmail.com</a>.</p>
      <p style="margin-top:10px">Podrobnější informace o ochraně osobních údajů jsou uvedeny v samostatném dokumentu – <a onclick="go('info?t=gdpr')" style="color:var(--green-glow);cursor:pointer">Zásady ochrany osobních údajů</a>.</p>

      <h2 style="font-family:'Archivo Black',sans-serif;font-size:18px;margin-bottom:10px;margin-top:20px;text-transform:uppercase">9. Mimosoudní řešení sporů</h2>
      <p>Kupující má právo na mimosoudní řešení spotřebitelského sporu z kupní smlouvy.</p>
      <p style="margin-top:10px">K mimosoudnímu řešení spotřebitelských sporů z kupní smlouvy je příslušná Česká obchodní inspekce, se sídlem Štěpánská 567/15, 120 00 Praha 2, IČ: 000 20 869, internetová adresa: <a href="https://adr.coi.cz/cs" target="_blank" style="color:var(--green-glow)">adr.coi.cz/cs</a>.</p>
      <p style="margin-top:10px">Platforma pro řešení sporů on-line je dostupná na adrese <a href="http://ec.europa.eu/consumers/odr" target="_blank" style="color:var(--green-glow)">ec.europa.eu/consumers/odr</a>.</p>
      <p style="margin-top:10px">Prodávající je oprávněn k prodeji zboží na základě živnostenského oprávnění. Živnostenské kontroly provádí příslušný živnostenský úřad.</p>

      <h2 style="font-family:'Archivo Black',sans-serif;font-size:18px;margin-bottom:10px;margin-top:20px;text-transform:uppercase">10. Závěrečná ustanovení</h2>
      <p>Veškerá ujednání mezi prodávajícím a kupujícím se řídí právním řádem České republiky.</p>
      <p style="margin-top:10px">Prodávající není ve vztahu ke kupujícímu vázán žádnými kodexy chování ve smyslu § 1826 odst. 1 písm. e) občanského zákoníku.</p>
      <p style="margin-top:10px">Kupní smlouva včetně obchodních podmínek je archivována prodávajícím v elektronické podobě a není přístupná třetím osobám.</p>
      <p style="margin-top:10px">Prodávající si vyhrazuje právo tyto obchodní podmínky měnit. Touto změnou nejsou dotčena práva a povinnosti vzniklá za účinnosti předchozího znění.</p>

// Hesla už NEJSOU v kódu - jsou bezpečně v Supabase
function getAdminUser(){return JSON.parse(sessionStorage.getItem('hopi_admin')||'null')}
function setAdminUser(u){u?sessionStorage.setItem('hopi_admin',JSON.stringify(u)):sessionStorage.removeItem('hopi_admin')}
function requireAdmin(){
  if(!getAdminUser()){go('admin-login');return false}
  return true;
}

// Při startu zkontrolovat jestli je session ještě platná
async function checkAdminSession(){
  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if(session){
      setAdminUser({
        email: session.user.email,
        name: session.user.email.split('@')[0],
        loginAt: Date.now()
      });
    } else {
      setAdminUser(null);
    }
  } catch(e){ console.warn('Session check fail:', e); }
}

window.tryAdminLogin=async function(){
  const email=document.getElementById('adminUsername').value.trim().toLowerCase();
  const password=document.getElementById('adminPassword').value;
  const err=document.getElementById('loginErr');
  const btn=document.getElementById('loginBtn');
  
  err.classList.remove('show');
  btn.disabled=true;
  btn.innerText='Přihlašuji...';
  
  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if(error){
      err.classList.add('show');
      err.innerText='Nesprávné přihlašovací údaje. Přístup mají pouze autorizovaní administrátoři.';
      document.getElementById('adminPassword').value='';
      btn.disabled=false;
      btn.innerText='Přihlásit →';
      return;
    }
    const userName = email.split('@')[0];
    setAdminUser({email, name: userName, loginAt: Date.now()});
    showToast('Vítej, '+userName+'!');
    setTimeout(()=>go('admin'),400);
  } catch(e){
    err.classList.add('show');
    err.innerText='Chyba připojení. Zkus to znovu.';
    btn.disabled=false;
    btn.innerText='Přihlásit →';

function renderSearchResults(){
  const q=(document.getElementById('searchInput').value||'').toLowerCase().trim();
  const container=document.getElementById('searchResults');
  const products=getProducts();

  if(!q){
    const featured=products.slice(0,6);
    container.innerHTML=`
      <div class="search-result-section">
        <div class="search-section-title">🔥 Nejoblíbenější</div>
        ${featured.map(p=>renderSearchResult(p)).join('')}
      </div>
    `;
    return;
  }

  const matchProduct=p=>
    p.name.toLowerCase().includes(q)||
    (p.categoryLabel||'').toLowerCase().includes(q)||
    (p.category||'').toLowerCase().includes(q)||
    (p.badge||'').toLowerCase().includes(q);

  const matched=products.filter(matchProduct);

  if(matched.length===0){
    container.innerHTML=`
      <div class="search-empty">
        <div class="search-empty-icon">🔍</div>
        <div style="color:#fff;font-weight:700;margin-bottom:8px">Nic nenalezeno</div>
        <div>Pro "${escapeHtml(q)}" jsme nic nenašli. Zkus jiná slova.</div>
      </div>
    `;
    return;
  }

  const byCategory={};
  matched.forEach(p=>{
    const cat=p.categoryLabel||p.category||'Ostatní';
    byCategory[cat]=byCategory[cat]||[];
    byCategory[cat].push(p);
  });

  container.innerHTML=Object.entries(byCategory).map(([cat,prods])=>`
    <div class="search-result-section">
      <div class="search-section-title">${escapeHtml(cat)} — ${prods.length} ${prods.length===1?'produkt':'produktů'}</div>
      ${prods.map(p=>renderSearchResult(p)).join('')}
    </div>
  `).join('');
}

  {id:'problems',name:'Problémy',icon:'⚠️',system:false,filter:'tag:problem'},
];

function getFolders(){
  const s=localStorage.getItem('hopi_folders');
  if(!s){localStorage.setItem('hopi_folders',JSON.stringify(DEFAULT_FOLDERS));return [...DEFAULT_FOLDERS]}
  const existing=JSON.parse(s);
  // Migrace — přidat nové systémové složky pokud chybí
  let changed=false;
  DEFAULT_FOLDERS.forEach(def=>{
    if(def.system&&!existing.find(f=>f.id===def.id)){
      existing.push(def);
      changed=true;
    }
  });
  if(changed)setFolders(existing);
  return existing;
}
function setFolders(f){localStorage.setItem('hopi_folders',JSON.stringify(f))}

function orderMatchesFolder(o,folder){
  if(!folder||folder.filter==='all')return true;
  if(folder.filter.startsWith('status:')){
    const list=folder.filter.substring(7).split(',');
    return list.includes(o.status||'new');
  }
  if(folder.filter.startsWith('tag:')){
    return (o.tags||[]).includes(folder.filter.substring(4));
  }
  if(folder.filter.startsWith('payment:')){
    return getPaymentStatus(o)===folder.filter.substring(8);
  }
  return true;
}

function countInFolder(folder,orders){
  return orders.filter(o=>orderMatchesFolder(o,folder)).length;
}

// Globální stav pohledu
let activeFolder='inbox';
let selectedIds=new Set();
let searchQuery='';
let sortBy='date-desc';
let drawerOpen=false;

function getFilteredOrders(){
  const folders=getFolders();
  const f=folders.find(x=>x.id===activeFolder)||folders[0];
  let list=getOrders().filter(o=>orderMatchesFolder(o,f));
  if(searchQuery){
    const q=searchQuery.toLowerCase().trim();
    list=list.filter(o=>
      o.id.toLowerCase().includes(q)||
      (o.customer.firstName+' '+o.customer.lastName).toLowerCase().includes(q)||
      (o.customer.email||'').toLowerCase().includes(q)||
      (o.customer.city||'').toLowerCase().includes(q)||
      (o.customer.phone||'').toLowerCase().includes(q)
    );
  }
  list.sort((a,b)=>{
    if(sortBy==='date-desc')return new Date(b.date)-new Date(a.date);
    if(sortBy==='date-asc')return new Date(a.date)-new Date(b.date);
    if(sortBy==='price-desc')return b.total-a.total;
    if(sortBy==='price-asc')return a.total-b.total;
    return 0;
  });
  return list;
}

function renderTags(tags){
  if(!tags||tags.length===0)return '';
  const colors={pending:'tag-yellow',problem:'tag-red',vip:'tag-purple',urgent:'tag-red',gift:'tag-blue',reclamation:'tag-red'};
  const labels={pending:'Čeká',problem:'Problém',vip:'VIP',urgent:'Spěchá',gift:'Dárek',reclamation:'Reklamace'};
  return tags.map(t=>{
    const folders=getFolders();
    const customFolder=folders.find(f=>f.filter==='tag:'+t);
    const label=labels[t]||(customFolder?customFolder.name:t);
    return `<span class="tag-chip ${colors[t]||'tag-gray'}">${escapeHtml(label)}</span>`;
  }).join('');
}

function formatShortDate(d){
  const dt=new Date(d);
  const now=new Date();
  const today=dt.getDate()===now.getDate()&&dt.getMonth()===now.getMonth()&&dt.getFullYear()===now.getFullYear();
  if(today)return 'Dnes '+dt.toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'});
  const yesterday=new Date(now);yesterday.setDate(yesterday.getDate()-1);
  const isYesterday=dt.getDate()===yesterday.getDate()&&dt.getMonth()===yesterday.getMonth()&&dt.getFullYear()===yesterday.getFullYear();
  if(isYesterday)return 'Včera '+dt.toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'});
  return dt.toLocaleDateString('cs-CZ',{day:'numeric',month:'numeric'});
}

window.bulkAdvance=function(){
  if(selectedIds.size===0)return;
  if(!confirm(`Posunout ${selectedIds.size} objednávek do dalšího stavu?`))return;
  let n=0;
  selectedIds.forEach(id=>{
    const o=getOrders().find(x=>x.id===id);
    if(o&&STATUSES[o.status||'new'].next){advanceOrderStatus(id);n++}
  });
  showToast(`Posunuto ${n} objednávek`);
  selectedIds.clear();
  viewAdmin();
}

window.bulkCancel=function(){
  if(selectedIds.size===0)return;
  if(!confirm(`Zrušit ${selectedIds.size} objednávek?`))return;
  selectedIds.forEach(id=>cancelOrder(id));
  showToast(`${selectedIds.size} zrušeno`);
  selectedIds.clear();
  viewAdmin();
}

window.bulkAddTag=function(){
  if(selectedIds.size===0)return;
  const opts=['pending','problem','vip','urgent','gift','reclamation'];
  const lbs={pending:'Čeká na platbu',problem:'Problém',vip:'VIP',urgent:'Spěchá',gift:'Dárek',reclamation:'Reklamace'};
  const c=prompt('Zadej číslo štítku:\n'+opts.map((t,i)=>(i+1)+'. '+lbs[t]).join('\n'));
  const i=Number(c)-1;
  if(isNaN(i)||i<0||i>=opts.length)return;
  const tag=opts[i];
  const orders=getOrders();
  selectedIds.forEach(id=>{
    const o=orders.find(x=>x.id===id);
    if(o){o.tags=o.tags||[];if(!o.tags.includes(tag))o.tags.push(tag)}
  });
  setOrders(orders);
  showToast(`Štítek přidán k ${selectedIds.size} obj.`);
  selectedIds.clear();
  viewAdmin();
}

window.bulkMoveToFolder=function(){
  if(selectedIds.size===0)return;
  const custom=getFolders().filter(f=>!f.system&&f.filter.startsWith('tag:'));
  if(custom.length===0){showToast('Nejdřív vytvoř vlastní složku','error');return}
  const c=prompt('Do které složky?\n'+custom.map((f,i)=>(i+1)+'. '+f.icon+' '+f.name).join('\n'));
  const i=Number(c)-1;
  if(isNaN(i)||i<0||i>=custom.length)return;
  const tag=custom[i].filter.substring(4);
  const orders=getOrders();
  selectedIds.forEach(id=>{
    const o=orders.find(x=>x.id===id);
    if(o){o.tags=o.tags||[];if(!o.tags.includes(tag))o.tags.push(tag)}
  });
  setOrders(orders);
  showToast(`Přesunuto do ${custom[i].name}`);
  selectedIds.clear();
  viewAdmin();
}

// ============ DRAG & DROP ============
let dragOrderId=null;
let touchGhost=null;
let touchStartY=0;

window.orderDragStart=function(e,id){
  dragOrderId=id;
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain',id);
  e.currentTarget.classList.add('dragging');
  // vlastní drag image
  const ghost=document.createElement('div');
  ghost.className='drag-ghost';
  ghost.textContent='📦 '+id;
  document.body.appendChild(ghost);
  e.dataTransfer.setDragImage(ghost,0,0);
  setTimeout(()=>ghost.remove(),0);
}

window.orderDragEnd=function(e){
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.folder-item.drop-target').forEach(x=>x.classList.remove('drop-target'));
  dragOrderId=null;
}

window.folderDragOver=function(e,folderId){
  if(!dragOrderId)return;
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  e.currentTarget.classList.add('drop-target');
}

window.folderDragLeave=function(e){
  e.currentTarget.classList.remove('drop-target');
}

window.folderDrop=function(e,folderId){
  e.preventDefault();
  e.currentTarget.classList.remove('drop-target');
  if(!dragOrderId)return;
  moveOrderToFolder(dragOrderId,folderId);
  dragOrderId=null;
}

function moveOrderToFolder(orderId,folderId){
  const folders=getFolders();
  const f=folders.find(x=>x.id===folderId);
  if(!f)return;
  const orders=getOrders();
  const o=orders.find(x=>x.id===orderId);
  if(!o)return;

  if(f.filter.startsWith('status:')){
    const newStatus=f.filter.substring(7).split(',')[0];
    if(!STATUSES[newStatus])return;
    o.status=newStatus;
    o.statusHistory=o.statusHistory||[];
    o.statusHistory.push({status:newStatus,at:Date.now()});
    setOrders(orders);
    showToast(`Posunuto na "${f.name}"`);
  }else if(f.filter.startsWith('tag:')){
    const tag=f.filter.substring(4);
    o.tags=o.tags||[];
    if(!o.tags.includes(tag))o.tags.push(tag);
    setOrders(orders);
    showToast(`Přesunuto do "${f.name}"`);
  }else if(f.id==='inbox'){
    // Vše = žádná akce, jen navigace
    return;
  }
  viewAdmin();
}

// Touch support pro mobilní DnD
window.touchStart=function(e,id){
  // mobile drag pomocí long press
  const card=e.currentTarget;
  const touch=e.touches[0];
  touchStartY=touch.clientY;
  let moved=false;

  const pressTimer=setTimeout(()=>{
    if(!moved){
      dragOrderId=id;
      card.classList.add('dragging');
      navigator.vibrate&&navigator.vibrate(30);

      touchGhost=document.createElement('div');
      touchGhost.className='drag-ghost';
      touchGhost.textContent='📦 '+id;
      touchGhost.style.left=touch.clientX+'px';
      touchGhost.style.top=touch.clientY+'px';
      document.body.appendChild(touchGhost);

      // Otevři drawer, ať má uživatel kam pustit
      drawerOpen=true;
      viewAdmin();
    }
  },400);

  function moveHandler(ev){
    const t=ev.touches[0];
    if(Math.abs(t.clientY-touchStartY)>10)moved=true;
    if(touchGhost){
      ev.preventDefault();
      touchGhost.style.left=t.clientX+'px';
      touchGhost.style.top=t.clientY+'px';
      // detekce folder pod prstem
      document.querySelectorAll('.folder-item.drop-target').forEach(x=>x.classList.remove('drop-target'));
      const el=document.elementFromPoint(t.clientX,t.clientY);
      const folder=el?.closest('.folder-item');
      if(folder)folder.classList.add('drop-target');
    }
  }

  function endHandler(ev){
    clearTimeout(pressTimer);
    card.classList.remove('dragging');
    card.removeEventListener('touchmove',moveHandler);
    card.removeEventListener('touchend',endHandler);
    if(touchGhost){
      const t=ev.changedTouches[0];
      const el=document.elementFromPoint(t.clientX,t.clientY);
      const folder=el?.closest('.folder-item');
      if(folder&&dragOrderId){
        moveOrderToFolder(dragOrderId,folder.dataset.folder);
      }
      touchGhost.remove();
      touchGhost=null;
    }
    dragOrderId=null;
    document.querySelectorAll('.folder-item.drop-target').forEach(x=>x.classList.remove('drop-target'));
  }

  card.addEventListener('touchmove',moveHandler,{passive:false});
  card.addEventListener('touchend',endHandler);
}

window.exportOrdersCSV=function(){
  const orders=getFilteredOrders();
  if(orders.length===0){showToast('Nic k exportu','error');return}
  let csv='ID,Datum,Zakaznik,Email,Telefon,Mesto,Stav,Polozek,Celkem\n';
  orders.forEach(o=>{
    csv+=`${o.id},${new Date(o.date).toLocaleString('cs-CZ')},"${o.customer.firstName} ${o.customer.lastName}",${o.customer.email||''},${o.customer.phone||''},${o.customer.city||''},${STATUSES[o.status||'new'].label},${o.items.reduce((s,i)=>s+i.qty,0)},${o.total}\n`;
  });
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`hopi-objednavky-${new Date().toISOString().split('T')[0]}.csv`;a.click();
  URL.revokeObjectURL(url);
  showToast('CSV staženo');
}

window.createTestOrder=function(){
  const products=getProducts();
  if(products.length===0){showToast('Nejdřív přidej produkty','error');return}
  const p=products[Math.floor(Math.random()*products.length)];
  const names=[['Jan','Novák'],['Petra','Horáková'],['Martin','Kříž'],['Lucie','Malá'],['Tomáš','Dvořák']];
  const cities=['Praha','Brno','Ostrava','Plzeň','Liberec'];
  const [fn,ln]=names[Math.floor(Math.random()*names.length)];
  const subtotal=p.price;
  const shipPrice=79;
  const order={
    id:'HV-'+Math.floor(100000+Math.random()*900000),
    items:[{productId:p.id,size:'M',qty:1}],
    customer:{firstName:fn,lastName:ln,email:`${fn.toLowerCase()}@test.cz`,phone:'+420 777 123 456',street:'Testovací 42',city:cities[Math.floor(Math.random()*cities.length)],zip:'110 00'},
    ship:'zasilkovna',pay:'card',subtotal,shipPrice,codFee:0,total:subtotal+shipPrice,
    status:'new',statusHistory:[{status:'new',at:Date.now()}],adminNote:'',
    date:new Date().toISOString(),
  };
  saveOrder(order);

}

window.sendManualEmail=async function(orderId){
  const o=getOrders().find(x=>x.id===orderId);
  if(!o){showToast('Objednávka nenalezena','error');return}
  if(!o.customer.email){showToast('Zákazník nemá e-mail','error');return}
  const status=o.status||'new';
  if(!confirm(`Odeslat e-mail pro stav "${STATUSES[status].label}" na ${o.customer.email}?`))return;
  showToast('Odesílám...');
  const r=await sendStatusEmail(o,status,{force:true});
  if(r.ok)showToast('✅ E-mail odeslán');
  else showToast('❌ '+(r.reason||'chyba'),'error');
  viewAdmin();
}

window.saveOrderNote=function(id){
  const orders=getOrders();
  const o=orders.find(x=>x.id===id);
  if(!o)return;
  o.adminNote=document.getElementById('adminNote').value;
  setOrders(orders);
  showToast('Poznámka uložena');
}

window.markAsPaid=function(id){
  const orders=getOrders();
  const o=orders.find(x=>x.id===id);
  if(!o)return;
  o.paymentStatus='paid';
  o.paidAt=Date.now();
  setOrders(orders);
  updateOrderInSheets(id,{paymentStatus:'paid',paidAt:o.paidAt}).catch(()=>{});
  showToast('✅ Objednávka označena jako zaplacená');
  viewAdmin();
}

window.markAsPending=function(id){
  if(!confirm('Vrátit stav na "Čeká na zaplacení"?'))return;
  const orders=getOrders();
  const o=orders.find(x=>x.id===id);
  if(!o)return;
  o.paymentStatus='pending';
  delete o.paidAt;
  setOrders(orders);
  updateOrderInSheets(id,{paymentStatus:'pending'}).catch(()=>{});
  showToast('Stav vrácen na čeká');
  viewAdmin();
}

window.saveOrderCustomer=function(id){
  const orders=getOrders();
  const o=orders.find(x=>x.id===id);
  if(!o)return;
  o.customer.firstName=document.getElementById('custFirst').value;
  o.customer.lastName=document.getElementById('custLast').value;
  o.customer.email=document.getElementById('custEmail').value;
  o.customer.phone=getPhoneValue('custPhone');
  o.customer.street=document.getElementById('custStreet').value;
  o.customer.city=document.getElementById('custCity').value;
  o.customer.zip=document.getElementById('custZip').value;
  setOrders(orders);
  showToast('Údaje uloženy');
}

window.saveTracking=function(id){
  const orders=getOrders();
  const o=orders.find(x=>x.id===id);
  if(!o)return;
  const number=document.getElementById('trackingNumber').value.trim();
  const carrier=document.getElementById('trackingCarrier').value;
  const url=document.getElementById('trackingUrl').value.trim();
  if(!number){showToast('Zadej číslo zásilky','error');return}
  o.tracking={number,carrier,url,setAt:Date.now()};
  setOrders(orders);
  showToast('✅ Sledování uloženo · zákazník ho uvidí v účtu');
  viewAdmin();
}

window.clearTracking=function(id){
  if(!confirm('Vymazat sledovací číslo?'))return;
  const orders=getOrders();
  const o=orders.find(x=>x.id===id);
  if(!o)return;
  delete o.tracking;
  setOrders(orders);
  showToast('Tracking vymazán');
  viewAdmin();
}

window.savePaymentMethods = async function(){
  const cfg = {};
  document.querySelectorAll('.payment-method-toggle').forEach(el => {
    cfg[el.dataset.method] = el.checked;
  });
  if(Object.values(cfg).filter(Boolean).length === 0){
    alert('⚠️ Musíš mít zapnutou alespoň jednu platební metodu.');
    return;
  }
  showToast('💾 Ukládám do Supabase...');
  const ok = await setPaymentMethodsConfig(cfg);
  if(ok){
    showToast('✅ Platební metody uloženy (sdílené pro všechny zákazníky)');
    setTimeout(() => viewAdmin(), 400);
  } else {
    alert('❌ Uložení selhalo. Zkontroluj připojení k Supabase a zda existuje tabulka app_settings.');
  }
}

window.resetPaymentMethods = async function(){
  if(!confirm('Obnovit výchozí nastavení platebních metod?\n\nKarta, Apple Pay, Převod a Dobírka budou zapnuté. Google Pay vypnutý.')) return;
  const def = {};
  for(const m of PAYMENT_METHODS_META) def[m.key] = m.defaultEnabled;
  const ok = await setPaymentMethodsConfig(def);
  if(ok){
    showToast('↺ Obnoveno výchozí nastavení');
    setTimeout(() => viewAdmin(), 400);
  } else {
    alert('❌ Uložení selhalo.');
  }
}

window.saveGopayConfig = async function(){
  const cfg = getGopayConfig();
  cfg.goid = document.getElementById('gopayGoid').value.trim();
  cfg.mode = document.querySelector('input[name="gopayMode"]:checked').value;
  cfg.enabled = document.getElementById('gopayEnabled').checked;
  if(cfg.enabled && !cfg.goid){
    alert('⚠️ Pro aktivaci musíš vyplnit GoID.');
    return;
  }
  showToast('💾 Ukládám do Supabase...');
  const ok = await setGopayConfig(cfg);
  if(ok){
    showToast('✅ GoPay nastavení uloženo (sdílené pro všechny zákazníky)');
    setTimeout(() => viewAdmin(), 400);
  } else {
    alert('❌ Uložení selhalo. Zkontroluj připojení k Supabase a zda existuje tabulka app_settings.');
  }
}

window.testGopayConnection = async function(){
  const cfg = getGopayConfig();
  if(!cfg.goid){
    alert('⚠️ Nejdřív vyplň GoID a ulož.');
    return;
  }
  showToast('🔌 Testuji Edge Function...');
  try {
    // Zkusíme zavolat create-payment s minimálním (neplatným) payloadem — chceme jen zjistit, jestli endpoint existuje a credentials sedí.
    const res = await fetch(SUPABASE_URL + '/functions/v1/gopay-create-payment', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
      },
      body: JSON.stringify({}),  // záměrně prázdné
    });
    const text = await res.text();
    if(res.status === 400 && text.includes('Chybí order')){
      alert('✅ Edge Function běží správně!\n\nEndpoint odpovídá očekávaně. Můžeš zkusit objednávku.\n\nDetail: ' + text);
    } else if(res.status === 500 && text.includes('GoPay není nakonfigurován')){
      alert('⚠️ Edge Function běží, ale Supabase secrets chybí.\n\nMusíš nastavit GOPAY_GOID, GOPAY_CLIENT_ID, GOPAY_CLIENT_SECRET v Supabase Dashboard → Project Settings → Edge Functions → Secrets.\n\nDetail: ' + text);
    } else if(res.status === 404){
      alert('❌ Edge Function není nasazená.\n\nMusíš ji nasadit přes Supabase CLI:\nsupabase functions deploy gopay-create-payment\n\nViz instalační návod.');
    } else {
      alert('ℹ️ Status: ' + res.status + '\n\nOdpověď: ' + text);
    }
  } catch(e){
    alert('❌ Chyba: ' + e.message + '\n\nPravděpodobně Edge Function není nasazená nebo Supabase URL je špatně.');
  }
}

window.testPacketaWidget=function(){
  const config=getShippingConfig();
  if(!config.packetaApiKey){
    alert('⚠️ Nejdřív vlož API klíč Zásilkovny a klikni Uložit.');
    return;
  }
  if(!config.packetaEnabled){
    alert('⚠️ Aktivuj checkbox "Aktivovat Zásilkovna widget" a klikni Uložit.');
    return;
  }
  // Načíst Packeta library pokud ještě není
  if(typeof Packeta === 'undefined'){
    showToast('🔌 Načítám Zásilkovna widget...');
    const script = document.createElement('script');
    script.src = 'https://widget.packeta.com/v6/www/js/library.js';
    script.onload = () => openPacketaWidget(config);
    script.onerror = () => alert('❌ Nepodařilo se načíst Zásilkovna widget. Zkontroluj internetové připojení.');
    document.head.appendChild(script);
  } else {
    openPacketaWidget(config);
  }
}

function openPacketaWidget(config){
  try {
    Packeta.Widget.pick(config.packetaApiKey, function(point){
      if(point){
        alert('✅ Vybráno výdejní místo:\n\n📍 '+point.name+'\n'+point.street+', '+point.city+'\n\nID: '+point.id+'\n\nWidget funguje! 🎉');
      } else {
        showToast('Žádná pobočka nevybrána');
      }
    }, {country: config.defaultCountry || 'cz', language: 'cs'});
  } catch(e){
    alert('❌ Chyba widgetu: '+e.message+'\n\nMožné důvody:\n- Špatný API klíč\n- Účet ještě není schválen Zásilkovnou\n- Síťový problém');
  }
}

function viewStats(){
  const orders=getOrders();
  const products=getProducts();
  const totalRev=orders.reduce((s,o)=>s+o.total,0);
  const delivered=orders.filter(o=>o.status==='delivered').length;
  const cancelled=orders.filter(o=>o.status==='cancelled').length;
  const avgOrder=orders.length?Math.round(totalRev/orders.length):0;
  const totalItems=orders.reduce((s,o)=>s+o.items.reduce((sum,i)=>sum+i.qty,0),0);

  // Bestsellery
  const productCounts={};
  orders.forEach(o=>o.items.forEach(i=>{productCounts[i.productId]=(productCounts[i.productId]||0)+i.qty}));
  const bestsellers=Object.entries(productCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);

  // Měsíční rozložení (posledních 6 měsíců)
  const monthNames=['Led','Úno','Bře','Dub','Kvě','Čer','Čvc','Srp','Zář','Říj','Lis','Pro'];
  const now=new Date();
  const monthBuckets=[];
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const end=new Date(now.getFullYear(),now.getMonth()-i+1,1);
    const monthOrders=orders.filter(o=>{const od=new Date(o.date);return od>=d&&od<end});
    monthBuckets.push({label:monthNames[d.getMonth()],count:monthOrders.length,rev:monthOrders.reduce((s,o)=>s+o.total,0)});
  }
  const maxRev=Math.max(1,...monthBuckets.map(b=>b.rev));

  return `
    <div class="view-head"><div><h1>Statistiky</h1><div class="sub">Celkový přehled výkonu shopu</div></div></div>
    <div class="admin-content">
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-label">Celkem objednávek</div><div class="stat-value">${orders.length}</div><div class="stat-delta">Za celou dobu</div></div>
        <div class="stat-card blue"><div class="stat-label">Celkový obrat</div><div class="stat-value">${formatPrice(totalRev)} Kč</div><div class="stat-delta">—</div></div>
        <div class="stat-card orange"><div class="stat-label">Průměrná objednávka</div><div class="stat-value">${formatPrice(avgOrder)} Kč</div><div class="stat-delta">—</div></div>
        <div class="stat-card"><div class="stat-label">Prodaných kusů</div><div class="stat-value">${totalItems}</div><div class="stat-delta">—</div></div>
        <div class="stat-card"><div class="stat-label">Doručené</div><div class="stat-value">${delivered}</div><div class="stat-delta">Úspěšně</div></div>
        <div class="stat-card red"><div class="stat-label">Zrušené</div><div class="stat-value">${cancelled}</div><div class="stat-delta">—</div></div>
      </div>

      <div class="panel">
        <div class="panel-head"><h3>Obrat za posledních 6 měsíců</h3><span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)">${monthBuckets.reduce((s,b)=>s+b.rev,0)>0?formatPrice(monthBuckets.reduce((s,b)=>s+b.rev,0))+' Kč':'Žádná data'}</span></div>
        <div style="padding:24px;display:flex;align-items:flex-end;gap:14px;height:240px">
          ${monthBuckets.map(b=>`
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%">
              <div style="flex:1;width:100%;display:flex;align-items:flex-end">
                <div style="width:100%;background:${b.rev>0?'linear-gradient(180deg,var(--green-glow),var(--green))':'#eee'};height:${Math.max(4,b.rev/maxRev*100)}%;position:relative;transition:all .3s" title="${formatPrice(b.rev)} Kč · ${b.count} obj.">
                  ${b.rev>0?`<div style="position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-family:'JetBrains Mono',monospace;font-size:10px;color:#111;font-weight:700;white-space:nowrap">${formatPrice(b.rev)}</div>`:''}
                </div>
              </div>
              <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:0.05em;text-transform:uppercase">${b.label}</div>
              <div style="font-size:11px;color:#444;font-weight:600">${b.count} obj.</div>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="panel">
        <div class="panel-head"><h3>🏆 Bestsellery</h3></div>
        <table class="atable">
          <thead><tr><th>#</th><th>Produkt</th><th>Prodáno</th><th>Výnos</th></tr></thead>
          <tbody>
            ${bestsellers.length===0?'<tr><td colspan="4" class="table-empty"><strong>Zatím žádné prodeje</strong></td></tr>':bestsellers.map(([pid,qty],idx)=>{
              const p=products.find(x=>x.id===Number(pid));
              if(!p)return '';
              return `<tr>
                <td style="font-family:'Archivo Black',sans-serif;font-size:18px;color:${idx===0?'#ffc107':(idx===1?'#9e9e9e':(idx===2?'#cd7f32':'#ccc'))}">${idx+1}</td>
                <td><strong>${escapeHtml(p.name)}</strong><div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);margin-top:3px">${escapeHtml(p.categoryLabel||p.category)}</div></td>
                <td style="font-family:'Archivo Black',sans-serif">${qty}× ks</td>
                <td style="font-family:'JetBrains Mono',monospace;font-weight:700">${formatPrice(qty*p.price)} Kč</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function getCosts(){return JSON.parse(localStorage.getItem('hopi_costs')||'{"production":0.35,"shipping":45,"packaging":12,"fees":0.029,"other":0}')}
function setCosts(c){localStorage.setItem('hopi_costs',JSON.stringify(c))}

function calculateOrderMargin(order){
  const products=getProducts();
  const costs=getCosts();
  let cogs=0; // Cost of goods sold
  order.items.forEach(i=>{
    const p=products.find(x=>x.id===i.productId);
    if(p){
      const prodCost=p.cost!=null?p.cost:(p.price*costs.production); // pokud produkt má cost, použij, jinak % z ceny
      cogs+=prodCost*i.qty;
    }
  });
  const fees=(order.subtotal||order.total)*costs.fees; // poplatek platební brány
  const shipCost=order.shipPrice?costs.shipping:0;
  const pack=costs.packaging;
  const totalCost=cogs+fees+shipCost+pack;
  const revenue=order.total;
  const margin=revenue-totalCost;
  const marginPct=revenue>0?(margin/revenue)*100:0;
  return {revenue,cogs,fees,shipCost,pack,totalCost,margin,marginPct};
}

window.copyForIdoklad=function(orderId){

  const o=orders.find(x=>x.id===orderId);
  if(!o){showToast('Objednávka nenalezena','error');return}
  const products=getProducts();

  const items=o.items.map(i=>{
    const p=products.find(x=>x.id===i.productId);
    if(!p)return '';
    return `${p.name}${i.size?' ('+i.size+')':''} — ${i.qty}× ${formatPrice(p.price)} Kč = ${formatPrice(p.price*i.qty)} Kč`;
  }).filter(Boolean).join('\n');

  let text=`═══════════════════════════════
OBJEDNÁVKA ${o.id}
${new Date(o.date).toLocaleDateString('cs-CZ')}
═══════════════════════════════

ODBĚRATEL:

${o.customer.street}
${o.customer.zip} ${o.customer.city}

E-mail: ${o.customer.email}

  if(o.invoice&&o.invoice.ico){

${o.invoice.companyName||''}

`;
  }

  text+=`
POLOŽKY:
${items}
${o.shipPrice?'\nDoprava: '+formatPrice(o.shipPrice)+' Kč':''}
${o.codFee?'Dobírka: '+formatPrice(o.codFee)+' Kč':''}
───────────────────────────────
CELKEM: ${formatPrice(o.total)} Kč
───────────────────────────────

Způsob platby: ${({card:'Karta',applepay:'Apple Pay',googlepay:'Google Pay',transfer:'Převod',cod:'Dobírka'}[o.pay]||o.pay)}
Doprava: ${({zasilkovna:'Zásilkovna',ppl:'PPL',kuryr:'Kurýr'}[o.ship]||o.ship)}${o.shipBranch?' — '+o.shipBranch:''}
`;

  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{
      showToast('✅ Údaje zkopírovány — vlož do iDokladu (Ctrl+V)');
    }).catch(()=>{fallbackCopy(text)});
  }else{
    fallbackCopy(text);
  }
}

function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;
  ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);
  ta.select();
  try{document.execCommand('copy');showToast('✅ Údaje zkopírovány');}
  catch(e){showToast('Kopírování selhalo','error');console.log(text);}
  document.body.removeChild(ta);
}

window.issueInvoice=function(orderId){
  const orders=getOrders();
  const o=orders.find(x=>x.id===orderId);
  if(!o){showToast('Objednávka nenalezena','error');return}
  const config=getInvoiceConfig();
  if(!config.enabled){
    showToast('⚠️ Nejdřív zapni fakturaci v nastavení','error');
    return;
  }
  if(!config.clientId||!config.clientSecret){
    showToast('⚠️ Nejdřív vyplň API údaje iDoklad','error');
    return;
  }

  // SIMULACE — v reálu by tu bylo volání iDoklad API
  // Skutečné volání iDoklad API vyžaduje backend kvůli OAuth a CORS.
  // Tady jen zaznamenáme fakturu jako "vystavenou" pro účely evidence.
  const invoiceNumber='2026'+String(getInvoicesLog().length+1).padStart(4,'0');
  const invoice={
    id:'INV-'+Date.now(),
    invoiceNumber,
    orderId:o.id,
    customerName:o.customer.firstName+' '+o.customer.lastName,
    customerEmail:o.customer.email,
    total:o.total,
    items:o.items,
    createdAt:Date.now(),
    idokladUrl:`https://app.idoklad.cz/Invoices/${invoiceNumber}`,
  };
  const log=getInvoicesLog();
  log.unshift(invoice);
  setInvoicesLog(log);

  // Uložit číslo faktury k objednávce
  o.invoiceId=invoice.id;
  o.invoiceNumber=invoiceNumber;
  setOrders(orders);

  showToast(`✅ Faktura ${invoiceNumber} vystavena`);
  viewAdmin();
}

function viewFinance(){
  const orders=getOrders();
  const paidOrders=orders.filter(o=>o.status!=='cancelled');
  const costs=getCosts();

  // Agregace
  let totalRev=0,totalCost=0,totalMargin=0;
  paidOrders.forEach(o=>{
    const m=calculateOrderMargin(o);
    totalRev+=m.revenue;
    totalCost+=m.totalCost;
    totalMargin+=m.margin;
  });
  const marginPct=totalRev>0?(totalMargin/totalRev)*100:0;

  // Tento měsíc
  const now=new Date();
  const monthStart=new Date(now.getFullYear(),now.getMonth(),1);
  const monthOrders=paidOrders.filter(o=>new Date(o.date)>=monthStart);
  let monthRev=0,monthMargin=0,monthCost=0;
  monthOrders.forEach(o=>{const m=calculateOrderMargin(o);monthRev+=m.revenue;monthMargin+=m.margin;monthCost+=m.totalCost});
  const monthMarginPct=monthRev>0?(monthMargin/monthRev)*100:0;

  // Minulý měsíc (pro srovnání)
  const prevMonthStart=new Date(now.getFullYear(),now.getMonth()-1,1);
  const prevMonthOrders=paidOrders.filter(o=>{const d=new Date(o.date);return d>=prevMonthStart&&d<monthStart});
  let prevRev=0;
  prevMonthOrders.forEach(o=>prevRev+=o.total);
  const revDiff=prevRev>0?((monthRev-prevRev)/prevRev*100):0;

  // Platby podle metody
  const payMethods={};
  paidOrders.forEach(o=>{payMethods[o.pay]=(payMethods[o.pay]||{count:0,rev:0});payMethods[o.pay].count++;payMethods[o.pay].rev+=o.total});

window.saveCosts=function(){
  const c={
    production:(Number(document.getElementById('cost_production').value)||0)/100,
    packaging:Number(document.getElementById('cost_packaging').value)||0,
    shipping:Number(document.getElementById('cost_shipping').value)||0,
    fees:(Number(document.getElementById('cost_fees').value)||0)/100,
    other:0,
  };
  setCosts(c);
  showToast('Náklady uloženy · marže přepočítána');
  viewAdmin();
}

window.exportFinanceCSV=function(){
  const orders=getOrders().filter(o=>o.status!=='cancelled');
  let csv='ID,Datum,Zakaznik,Obrat,Naklady,Zisk,Marze\n';
  orders.forEach(o=>{
    const m=calculateOrderMargin(o);
    csv+=`${o.id},${new Date(o.date).toLocaleDateString('cs-CZ')},"${o.customer.firstName} ${o.customer.lastName}",${m.revenue},${Math.round(m.totalCost)},${Math.round(m.margin)},${m.marginPct.toFixed(1)}%\n`;
  });
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='hopi-finance.csv';a.click();
  URL.revokeObjectURL(url);
  showToast('CSV staženo');
}
