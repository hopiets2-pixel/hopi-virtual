window.testPacketaWidget=function(){
  const config=getShippingConfig();
  if(!config.packetaApiKey){
    alert('⚠️ Nejdřív vlož API klíč Zásilkovny a klikni Uložit.');
    return;
  }
  if(!config.packetaEnabled){
    alert('⚠️ Aktivuj checkbox "Aktivovat Zásilkovna widget" a klikni Uložit.');
    return;
  }
  // Načíst Packeta library pokud ještě není
  if(typeof Packeta === 'undefined'){
    showToast('🔌 Načítám Zásilkovna widget...');
    const script = document.createElement('script');
    script.src = 'https://widget.packeta.com/v6/www/js/library.js';
    script.onload = () => openPacketaWidget(config);
    script.onerror = () => alert('❌ Nepodařilo se načíst Zásilkovna widget. Zkontroluj internetové připojení.');
    document.head.appendChild(script);
  } else {
    openPacketaWidget(config);
  }
}

function openPacketaWidget(config){
  try {
    Packeta.Widget.pick(config.packetaApiKey, function(point){
      if(point){
        alert('✅ Vybráno výdejní místo:\n\n📍 '+point.name+'\n'+point.street+', '+point.city+'\n\nID: '+point.id+'\n\nWidget funguje! 🎉');
      } else {
        showToast('Žádná pobočka nevybrána');
      }
    }, {country: config.defaultCountry || 'cz', language: 'cs'});
  } catch(e){
    alert('❌ Chyba widgetu: '+e.message+'\n\nMožné důvody:\n- Špatný API klíč\n- Účet ještě není schválen Zásilkovnou\n- Síťový problém');
  }
}

function viewStats(){
  const orders=getOrders();
  const products=getProducts();
  const totalRev=orders.reduce((s,o)=>s+o.total,0);
  const delivered=orders.filter(o=>o.status==='delivered').length;
  const cancelled=orders.filter(o=>o.status==='cancelled').length;
  const avgOrder=orders.length?Math.round(totalRev/orders.length):0;
  const totalItems=orders.reduce((s,o)=>s+o.items.reduce((sum,i)=>sum+i.qty,0),0);

  // Bestsellery
  const productCounts={};
  orders.forEach(o=>o.items.forEach(i=>{productCounts[i.productId]=(productCounts[i.productId]||0)+i.qty}));
  const bestsellers=Object.entries(productCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);

  // Měsíční rozložení (posledních 6 měsíců)
  const monthNames=['Led','Úno','Bře','Dub','Kvě','Čer','Čvc','Srp','Zář','Říj','Lis','Pro'];
  const now=new Date();
  const monthBuckets=[];
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const end=new Date(now.getFullYear(),now.getMonth()-i+1,1);
    const monthOrders=orders.filter(o=>{const od=new Date(o.date);return od>=d&&od<end});
    monthBuckets.push({label:monthNames[d.getMonth()],count:monthOrders.length,rev:monthOrders.reduce((s,o)=>s+o.total,0)});
  }
  const maxRev=Math.max(1,...monthBuckets.map(b=>b.rev));

  return `
    <div class="view-head"><div><h1>Statistiky</h1><div class="sub">Celkový přehled výkonu shopu</div></div></div>
    <div class="admin-content">

}

window.toggleTemplate=async function(key){
  const t=getEmailTemplates();
  if(!t[key])return;
  t[key].enabled=!t[key].enabled;
  await setEmailTemplates(t);
  showToast(t[key].enabled?`E-maily pro "${STATUSES[key].label}" zapnuty`:`E-maily pro "${STATUSES[key].label}" vypnuty`);
  viewAdmin();
}

window.toggleEditTemplate=function(key){
  editingTemplateKey=editingTemplateKey===key?null:key;
  viewAdmin();
}

window.saveTemplate=async function(key){
  const t=getEmailTemplates();
  if(!t[key])return;
  t[key].subject=document.getElementById('tpl_subject_'+key).value;
  t[key].body=document.getElementById('tpl_body_'+key).value;
  await setEmailTemplates(t);
  editingTemplateKey=null;
  showToast('Šablona uložena');
  viewAdmin();
}

window.resetTemplate=async function(key){
  if(!confirm('Obnovit výchozí text této šablony?'))return;
  const t=getEmailTemplates();
  if(!DEFAULT_EMAIL_TEMPLATES[key])return;
  t[key]={...DEFAULT_EMAIL_TEMPLATES[key]};
  await setEmailTemplates(t);
  showToast('Šablona obnovena');
  viewAdmin();
}

window.previewEmail=function(key){

function getCosts(){return JSON.parse(localStorage.getItem('hopi_costs')||'{"production":0.35,"shipping":45,"packaging":12,"fees":0.029,"other":0}')}
function setCosts(c){localStorage.setItem('hopi_costs',JSON.stringify(c))}

function calculateOrderMargin(order){
  const products=getProducts();
  const costs=getCosts();
  let cogs=0;   // Náklady na produkt (součet productCost * qty)
  let pack=0;   // Náklady na balení (součet packagingCost * qty)
  order.items.forEach(i=>{
    const p=products.find(x=>x.id===i.productId);
    if(p){
      if(p.productCost!=null) cogs+=p.productCost*i.qty;
      if(p.packagingCost!=null) pack+=p.packagingCost*i.qty;
    }
  });
  const fees=(order.subtotal||order.total)*costs.fees; // % platební brány
  const shipCost=order.shipPrice?costs.shipping:0;     // doprava (globální sazba)
  const totalCost=cogs+pack+fees+shipCost;
  const revenue=order.total;
  const margin=revenue-totalCost;
  const marginPct=revenue>0?(margin/revenue)*100:0;
  return {revenue,cogs,fees,shipCost,pack,totalCost,margin,marginPct};
}

  }).filter(Boolean).join('\n');

`;

  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{
      showToast('✅ Údaje zkopírovány — vlož do iDokladu (Ctrl+V)');
    }).catch(()=>{fallbackCopy(text)});
  }else{
    fallbackCopy(text);
  }
}

function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;
  ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);
  ta.select();
  try{document.execCommand('copy');showToast('✅ Údaje zkopírovány');}
  catch(e){showToast('Kopírování selhalo','error');console.log(text);}
  document.body.removeChild(ta);
}

window.issueInvoice=async function(orderId, opts={}){
  const orders=getOrders();
  const o=orders.find(x=>x.id===orderId);
  if(!o){showToast('Objednávka nenalezena','error');return}
  const config=getInvoiceConfig();
  if(!config.enabled){
    showToast('⚠️ Nejdřív zapni fakturaci v nastavení','error');
    return;
  }

  showToast('⏳ Vystavuji fakturu v iDokladu…');

  try{
    const products=getProducts();

    const {data,error}=await supabaseClient.functions.invoke('idoklad-create-invoice',{
      body:{
        order:o,
        products:products,
        config:{
          companyName:config.companyName,
          companyIco:config.companyIco,
          companyDic:config.companyDic,
          companyAddress:config.companyAddress,
        },
      },
    });

    if(error||!data||!data.success){
      throw new Error((error&&error.message)||(data&&data.error)||'Neznámá chyba iDokladu');
    }

    const invoice={
      id:'INV-'+Date.now(),
      invoiceId:data.invoiceId,
      invoiceNumber:data.invoiceNumber,
      orderId:o.id,
      customerName:o.customer.firstName+' '+o.customer.lastName,
      customerEmail:o.customer.email,
      total:o.total,
      items:o.items,
      createdAt:Date.now(),
      idokladUrl:data.idokladUrl,
    };
    const log=getInvoicesLog();
    log.unshift(invoice);
    setInvoicesLog(log);

    o.invoiceId=invoice.invoiceId||invoice.id;
    o.invoiceNumber=data.invoiceNumber;
    setOrders(orders);

    showToast('✅ Faktura '+data.invoiceNumber+' vystavena v iDokladu');
    if(!opts?.silent) viewAdmin();

  }catch(err){
    console.error('issueInvoice error:',err);
    showToast('❌ Chyba při vystavení faktury: '+err.message,'error');
  }
}

function viewFinance(){
  const orders=getOrders();
  const paidOrders=orders.filter(o=>o.status!=='cancelled');
  const costs=getCosts();

  // Agregace
  let totalRev=0,totalCost=0,totalMargin=0;
  paidOrders.forEach(o=>{
    const m=calculateOrderMargin(o);
    totalRev+=m.revenue;
    totalCost+=m.totalCost;
    totalMargin+=m.margin;
  });
  const marginPct=totalRev>0?(totalMargin/totalRev)*100:0;

  // Tento měsíc
  const now=new Date();
  const monthStart=new Date(now.getFullYear(),now.getMonth(),1);
  const monthOrders=paidOrders.filter(o=>new Date(o.date)>=monthStart);
  let monthRev=0,monthMargin=0,monthCost=0;
  monthOrders.forEach(o=>{const m=calculateOrderMargin(o);monthRev+=m.revenue;monthMargin+=m.margin;monthCost+=m.totalCost});
  const monthMarginPct=monthRev>0?(monthMargin/monthRev)*100:0;

  // Minulý měsíc (pro srovnání)

  let prevRev=0;
  prevMonthOrders.forEach(o=>prevRev+=o.total);
  const revDiff=prevRev>0?((monthRev-prevRev)/prevRev*100):0;

window.saveCosts=function(){
  const existing=getCosts();
  const c={
    production:existing.production||0,
    packaging:existing.packaging||0,
    shipping:Number(document.getElementById('cost_shipping').value)||0,
    fees:(Number(document.getElementById('cost_fees').value)||0)/100,
    other:0,
  };
  setCosts(c);
  showToast('Náklady uloženy · marže přepočítána');
  viewAdmin();
}

window.exportFinanceCSV=function(){
  const orders=getOrders().filter(o=>o.status!=='cancelled');
  let csv='ID,Datum,Zakaznik,Obrat,Naklady,Zisk,Marze\n';
  orders.forEach(o=>{
    const m=calculateOrderMargin(o);
    csv+=`${o.id},${new Date(o.date).toLocaleDateString('cs-CZ')},"${o.customer.firstName} ${o.customer.lastName}",${m.revenue},${Math.round(m.totalCost)},${Math.round(m.margin)},${m.marginPct.toFixed(1)}%\n`;
  });
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='hopi-finance.csv';a.click();
  URL.revokeObjectURL(url);
  showToast('CSV staženo');
}

window.updatePromoType=function(){
  const type=document.querySelector('input[name="promoType"]:checked')?.value||'percent';
  const unit=document.getElementById('promoValueUnit');
  const hint=document.getElementById('promoValueHint');
  const input=document.getElementById('promoValue');
  const tP=document.getElementById('typeP');
  const tF=document.getElementById('typeF');
  if(!unit)return;
  if(type==='percent'){
    unit.textContent='(%)';
    hint.textContent='Kolik procent slevy chceš dát? (1-99)';
    input.max=99;
    input.placeholder='10';
    tP.style.borderColor='var(--green)';tP.style.background='rgba(0,138,63,0.05)';
    tF.style.borderColor='#ddd';tF.style.background='#fff';
  }else{
    unit.textContent='(Kč)';
    hint.textContent='Kolik Kč slevy chceš dát?';
    input.removeAttribute('max');
    input.placeholder='200';
    tF.style.borderColor='var(--green)';tF.style.background='rgba(0,138,63,0.05)';
    tP.style.borderColor='#ddd';tP.style.background='#fff';
  }
}

window.savePromoFromModal=function(existingCode){
  let code=(document.getElementById('promoCode').value||'').toUpperCase().replace(/[^A-Z0-9]/g,'').trim();
  const type=document.querySelector('input[name="promoType"]:checked').value;
  const value=Number(document.getElementById('promoValue').value);
  const minAmount=Number(document.getElementById('promoMin').value||0);
  const maxUsesRaw=document.getElementById('promoMaxUses').value;
  const maxUses=maxUsesRaw?Number(maxUsesRaw):null;

  if(!code||code.length<3){showToast('❌ Kód musí mít alespoň 3 znaky','error');return}
  if(!value||value<=0){showToast('❌ Zadej platnou hodnotu slevy','error');return}
  if(type==='percent'&&value>=100){showToast('❌ Procentuální sleva musí být pod 100%','error');return}

  const promos=getPromos();
  if(!existingCode&&promos.find(p=>p.code===code)){
    showToast('❌ Kód '+code+' už existuje','error');return;
  }
  if(existingCode){
    const p=promos.find(x=>x.code===existingCode);
    if(p){
      p.type=type;p.value=value;p.minAmount=minAmount;p.maxUses=maxUses;
    }
  }else{
    promos.push({
      code,type,value,minAmount,maxUses,
      active:true,uses:0,createdAt:Date.now(),
    });
  }
  setPromos(promos);
  document.getElementById('promoModal')?.remove();
  showToast('✅ Kód '+code+' '+(existingCode?'upraven':'vytvořen'));
  viewAdmin();
}

window.togglePromo=function(code){
  const promos=getPromos();
  const p=promos.find(x=>x.code===code);
  if(!p)return;
  p.active=!p.active;
  setPromos(promos);
  showToast(p.active?'Kód aktivován':'Kód deaktivován');
  viewAdmin();
}

window.deletePromo=function(code){
  if(!confirm('Smazat kód '+code+'?'))return;
  setPromos(getPromos().filter(p=>p.code!==code));
  showToast('Kód smazán');
  viewAdmin();
}

// ============== PRODUCT MODAL ==============
let editingId=null;
let modalPhoto=null;

// Interní stav per-size stocku při editaci v modalu
// Klíč: název size (string), hodnota: počet kusů (number)
let _modalSizeStocks={};
// Předchozí hodnota pole mSizes (pro porovnání při změně)
let _modalSizesPrev='';
// Debounce timer pro oninput na mSizes
let _modalSizesTimer=null;

// Vykreslí per-size stock inputy v modalu
function renderModalSizeInputs(sizes){
  const inner=document.getElementById('mStockSizesInner');
  if(!inner)return;
  inner.innerHTML=sizes.map(sz=>`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
      <span style="font-family:'JetBrains Mono',monospace;font-size:12px;min-width:48px;text-transform:uppercase">${escapeHtml(sz)}</span>
      <input type="number" min="0" placeholder="0"
        value="${_modalSizeStocks[sz]!==undefined?_modalSizeStocks[sz]:0}"
        oninput="_modalSizeStocks['${escapeHtml(sz).replace(/'/g,"\\'")}'] = Math.max(0,parseInt(this.value)||0)"
        style="width:100px;padding:8px 10px;background:#0a0a0a;border:1px solid var(--border);color:#fff;font-family:'Archivo',sans-serif;font-size:14px">
      <span style="font-size:12px;color:var(--muted)">ks</span>
      ${(_modalSizeStocks[sz]||0)===0?'<span style="font-size:10px;color:var(--red)">0 = vyprodáno</span>':''}
    </div>`).join('');
}

// Přepne zobrazení mStock ↔ mStockSizes podle počtu velikostí
function syncModalStockUI(sizes){
  const mStockEl=document.getElementById('mStock');
  const mStockSizesEl=document.getElementById('mStockSizes');
  if(!mStockEl||!mStockSizesEl)return;
  if(sizes.length>1){
    // Multi-size: skrýt jednopolíčkový stock, zobrazit per-size tabulku
    mStockEl.closest('label') && (mStockEl.previousElementSibling||mStockEl.parentElement);
    // Skrýt label + input mStock
    mStockEl.style.display='none';
    const prevLabel=mStockEl.previousElementSibling;
    if(prevLabel&&prevLabel.tagName==='LABEL')prevLabel.style.display='none';
    mStockSizesEl.style.display='';
    renderModalSizeInputs(sizes);
  } else {
    // Single-size: zobrazit mStock, skrýt per-size tabulku
    mStockEl.style.display='';
    const prevLabel=mStockEl.previousElementSibling;
    if(prevLabel&&prevLabel.tagName==='LABEL')prevLabel.style.display='';
    mStockSizesEl.style.display='none';
  }
}

// Handler pro oninput na poli mSizes — s debounce 400ms a confirm dialogem
window.onModalSizesChange=function(newVal){
  clearTimeout(_modalSizesTimer);
  _modalSizesTimer=setTimeout(()=>{
    const newSizes=(newVal||'').split('/').map(s=>s.trim()).filter(Boolean);
    const oldSizes=(_modalSizesPrev||'').split('/').map(s=>s.trim()).filter(Boolean);

    // Najít odstraněné size (byly dříve, teď nejsou)
    const removed=oldSizes.filter(s=>!newSizes.includes(s));

    // Pro každou odstraněnou size se stockem > 0 zobrazit confirm
    for(const sz of removed){
      const cnt=_modalSizeStocks[sz]||0;
      if(cnt>0){
        const ok=confirm(`Velikost „${sz}" má skladem ${cnt} ks.\nOpravdu ji chceš odebrat? Stock se nenávratně smaže.`);
        if(!ok){
          // Vrátit pole mSizes na předchozí hodnotu
          const el=document.getElementById('mSizes');
          if(el)el.value=_modalSizesPrev;
          return; // Zrušit změnu
        }
      }
      // Potvrdit smazání — odebrat ze stocků
      delete _modalSizeStocks[sz];
    }

    // Přidat nové size s výchozím stockem 0 (pokud ještě nejsou)
    newSizes.forEach(sz=>{ if(_modalSizeStocks[sz]===undefined)_modalSizeStocks[sz]=0; });

    _modalSizesPrev=newVal;
    syncModalStockUI(newSizes);
  },400);
};
window.adjustStock=function(productId,delta,size){
  const products=getProducts();
  const p=products.find(x=>x.id===productId);
  if(!p)return;
  if(p.stock!==null&&typeof p.stock==='object'&&size){
    // Multi-size: adjustovat konkrétní velikost
    p.stock={...p.stock,[size]:Math.max(0,(Number(p.stock[size])||0)+delta)};
  } else {
    if(p.stock===undefined)p.stock=0;
    p.stock=Math.max(0,(Number(p.stock)||0)+delta);
  }
  setProductsLS(products);
  viewAdmin();
}

window.openProductModal=function(id=null){
  editingId=id;modalPhoto=null;
  // Resetovat interní stav per-size stocků
  _modalSizeStocks={};
  _modalSizesPrev='';
  ['mId','mName','mPrice','mSizes','mBadge','mStock','mProductCost','mPackagingCost'].forEach(f=>{const el=document.getElementById(f);if(el)el.value=''});
  // Resetovat viditelnost stock polí
  const mStockEl=document.getElementById('mStock');
  if(mStockEl){mStockEl.style.display='';const pl=mStockEl.previousElementSibling;if(pl&&pl.tagName==='LABEL')pl.style.display='';}
  const mStockSizesEl=document.getElementById('mStockSizes');
  if(mStockSizesEl)mStockSizesEl.style.display='none';
  document.getElementById('mCat').value='trika';
  document.getElementById('mMock').value='tee';
  document.getElementById('mDelete').style.display='none';
  document.getElementById('modalTitle').innerText='Přidat produkt';
  document.getElementById('mPreview').innerHTML='<div class="photo-preview-empty">Klikni pro nahrání</div>';
  if(id){
    const p=getProduct(id);
    if(p){
      document.getElementById('mId').value=p.id;
      document.getElementById('mName').value=p.name||'';
      document.getElementById('mCat').value=p.category||'trika';
      document.getElementById('mPrice').value=p.price||'';
      document.getElementById('mSizes').value=p.sizes||'';
      document.getElementById('mBadge').value=p.badge||'';
      document.getElementById('mMock').value=p.mockType||'tee';
      // Načíst stock — objekt (multi-size) nebo číslo (single)
      if(p.stock!==null&&typeof p.stock==='object'){
        // Multi-size: naplnit _modalSizeStocks z objektu
        _modalSizeStocks={...p.stock};
      } else {
        const stockEl=document.getElementById('mStock');
        if(stockEl)stockEl.value=p.stock!==undefined?p.stock:'';
      }
      _modalSizesPrev=p.sizes||'';
      // Zobrazit správné UI podle počtu size
      const sizes=(p.sizes||'').split('/').map(s=>s.trim()).filter(Boolean);
      syncModalStockUI(sizes);
      const pcEl=document.getElementById('mProductCost');
      if(pcEl)pcEl.value=p.productCost!=null?p.productCost:'';
      const pkEl=document.getElementById('mPackagingCost');
      if(pkEl)pkEl.value=p.packagingCost!=null?p.packagingCost:'';
      if(p.photo){modalPhoto=p.photo;document.getElementById('mPreview').innerHTML=`<img src="${p.photo}">`}
      document.getElementById('mDelete').style.display='';
      document.getElementById('modalTitle').innerText='Upravit produkt';
    }
  }
  document.getElementById('productModal').classList.add('show');
}
window.closeModal=function(){document.getElementById('productModal').classList.remove('show')}
window.handleModalPhoto=function(e){
  const f=e.target.files[0];if(!f)return;
  if(f.size>2*1024*1024){alert('Max 2 MB');return}
  const r=new FileReader();
  r.onload=ev=>{modalPhoto=ev.target.result;document.getElementById('mPreview').innerHTML=`<img src="${modalPhoto}">`};
  r.readAsDataURL(f);
}
window.removeModalPhoto=function(){modalPhoto=null;document.getElementById('mPhoto').value='';document.getElementById('mPreview').innerHTML='<div class="photo-preview-empty">Klikni pro nahrání</div>'}
window.saveFromModal=function(){
  const name=document.getElementById('mName').value.trim();
  const cat=document.getElementById('mCat').value;
  const price=parseInt(document.getElementById('mPrice').value)||0;
  if(!name){alert('Zadej název');return}
  if(price<=0){alert('Zadej cenu');return}
  const stockVal=document.getElementById('mStock')?.value;
  const sizesVal=document.getElementById('mSizes').value.trim();
  const sizesArr=(sizesVal||'').split('/').map(s=>s.trim()).filter(Boolean);
  // Multi-size: uložit stock jako objekt; single-size: jako číslo
  const stock=sizesArr.length>1
    ?Object.fromEntries(sizesArr.map(sz=>[sz,Math.max(0,Number(_modalSizeStocks[sz])||0)]))
    :(stockVal===''||stockVal===undefined?undefined:Math.max(0,parseInt(stockVal)||0));
  const productCostVal=document.getElementById('mProductCost')?.value;
  const productCost=productCostVal===''||productCostVal===undefined?undefined:parseFloat(productCostVal)||0;
  const packagingCostVal=document.getElementById('mPackagingCost')?.value;
  const packagingCost=packagingCostVal===''||packagingCostVal===undefined?undefined:parseFloat(packagingCostVal)||0;
  const data={name,category:cat,categoryLabel:CATEGORY_LABELS[cat],price,sizes:sizesVal,badge:document.getElementById('mBadge').value.trim(),mockType:document.getElementById('mMock').value,photo:modalPhoto,stock,productCost,packagingCost};
  let products=getProducts();
  if(editingId){products=products.map(p=>p.id===editingId?{...p,...data}:p);showToast('Upraveno')}
  else{data.id=products.length?Math.max(...products.map(p=>p.id))+1:1;products.push(data);showToast('Přidáno')}
  setProductsLS(products);
  closeModal();
  viewAdmin();
}
window.deleteFromModal=function(){
  if(!editingId||!confirm('Smazat?'))return;
  const delId = editingId;
  setProductsLS(getProducts().filter(p=>p.id!==delId));
  if(_supabaseReady) deleteProductFromSupabase(delId);
  closeModal();showToast('Smazáno');viewAdmin();
}
window.resetProd=function(){
  if(!confirm('Obnovit výchozí produkty?'))return;
  setProductsLS(DEFAULT_PRODUCTS);showToast('Obnoveno');viewAdmin();
}
